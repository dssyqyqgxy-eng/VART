name: Extract iOS Firmware Components

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      device:
        description: '设备型号'
        required: false
        default: 'iPhone11,2'
      version:
        description: 'iOS 版本'
        required: false
        default: '18.7.6'

env:
  DEVICE: ${{ github.event.inputs.device || 'iPhone11,2' }}
  VERSION: ${{ github.event.inputs.version || '18.7.6' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create output directories
        run: mkdir -p ios_extracted/{daemons,frameworks,dyld_cache}
      
      # ========== 使用 Go 直接安装 ipsw（最可靠） ==========
      - name: Install ipsw via Go
        run: |
          # 安装 Go
          sudo apt-get update -qq
          sudo apt-get install -y -qq golang-go
          
          # 使用 go install 安装 ipsw（绕过 GitHub release 下载问题）
          go install github.com/blacktop/ipsw/cmd/ipsw@latest
          
          # 添加到 PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$HOME/go/bin:$PATH"
          
          # 验证
          $HOME/go/bin/ipsw version || echo "安装中..."
          
          # 如果 go install 成功，创建符号链接
          if [ -f "$HOME/go/bin/ipsw" ]; then
            sudo ln -sf $HOME/go/bin/ipsw /usr/local/bin/ipsw
            echo "✅ ipsw 安装成功"
          fi
      
      # 备用方案：使用预编译二进制（带 User-Agent）
      - name: Install ipsw (fallback)
        if: steps.install-go.outcome != 'success'
        run: |
          echo "使用备用方案安装 ipsw..."
          
          # 添加 User-Agent 避免被 GitHub API 限流
          wget --header="User-Agent: Mozilla/5.0" \
               --tries=5 \
               --retry-connrefused \
               https://github.com/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.tar.gz
          
          if [ -f "ipsw_3.1.628_linux_amd64.tar.gz" ] && [ $(stat -c%s "ipsw_3.1.628_linux_amd64.tar.gz") -gt 100000 ]; then
            tar -xzf ipsw_*.tar.gz
            sudo mv ipsw /usr/local/bin/
            chmod +x /usr/local/bin/ipsw
            rm -f ipsw_*.tar.gz
            echo "✅ ipsw 安装成功"
          else
            echo "❌ 下载失败，文件大小异常"
            exit 0
          fi
      
      # ========== 检查并下载固件 ==========
      - name: Download firmware
        run: |
          echo "设备: $DEVICE"
          echo "版本: $VERSION"
          
          # 使用 ipsw 下载固件
          ipsw download $DEVICE --version $VERSION -o firmware.ipsw || {
            echo "⚠️ 版本 $VERSION 不存在，尝试获取最新版本..."
            # 获取最新可用版本
            LATEST=$(ipsw download --list --device $DEVICE 2>/dev/null | grep -E "iOS [0-9]" | head -1 | awk '{print $2}')
            echo "最新版本: $LATEST"
            ipsw download $DEVICE --version $LATEST -o firmware.ipsw
          }
          
          ls -lh firmware.ipsw || echo "下载失败"
        continue-on-error: true
      
      # ========== 提取 dyld 缓存 ==========
      - name: Extract dyld cache
        run: |
          if [ ! -f "firmware.ipsw" ]; then
            echo "没有固件文件，跳过"
            exit 0
          fi
          
          # 解压 IPSW
          unzip -o firmware.ipsw -d firmware/
          
          # 找到系统 DMG
          SYSTEM_DMG=$(find firmware -name "*_.dmg" -o -name "*_System.dmg" | head -1)
          
          if [ -n "$SYSTEM_DMG" ]; then
            echo "提取 dyld 缓存从: $SYSTEM_DMG"
            ipsw extract dyld_shared_cache "$SYSTEM_DMG" -o ios_extracted/dyld_cache/ || true
          fi
          
          # 查找结果
          find ios_extracted -name "dyld_shared_cache*" -type f
        continue-on-error: true
      
      # ========== 提取守护进程 ==========
      - name: Extract daemons
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            echo "未找到 dyld 缓存"
            exit 0
          fi
          
          echo "使用缓存: $DYLD"
          
          for daemon in amfid installd sandboxd trustd; do
            echo "提取 $daemon..."
            ipsw dyld extract "$DYLD" --extract "$daemon" --output ios_extracted/daemons/ 2>/dev/null || true
          done
          
          ls -la ios_extracted/daemons/
        continue-on-error: true
      
      # ========== 提取框架 ==========
      - name: Extract frameworks
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            exit 0
          fi
          
          ipsw dyld extract "$DYLD" --extract "AppleMobileFileIntegrity" --output ios_extracted/frameworks/ 2>/dev/null || true
          ipsw dyld extract "$DYLD" --extract "Security" --output ios_extracted/frameworks/ 2>/dev/null || true
          
          ls -la ios_extracted/frameworks/
        continue-on-error: true
      
      # ========== 打包并上传 ==========
      - name: Package results
        run: |
          if [ -d "ios_extracted" ]; then
            tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted/ || echo "打包失败"
            echo "✅ 打包完成"
            ls -lh ios_extracted_*.tar.gz
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted_${{ env.DEVICE }}_${{ env.VERSION }}
          path: ios_extracted_*.tar.gz
          retention-days: 7
          if-no-files-found: warn
