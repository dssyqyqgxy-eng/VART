name: 完整 CoreTrust 分析

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压框架
        run: |
          unzip -q amfid.zip -d extracted_frameworks/ 2>/dev/null || true
          echo "=== 仓库文件 ==="
          ls -lh amfid installd trustd kernelcache* valid.sqlite3 2>/dev/null || true
          ls -lhR com.apple.tips*/ 2>/dev/null || true
          find extracted_frameworks -type f 2>/dev/null

      - name: 安装工具
        run: |
          brew install radare2 lzfse binutils sqlite
          brew tap blacktop/tap && brew install ipsw

      - name: 创建输出目录
        run: mkdir -p output/{kernel,launchd,daemons,frameworks,sqlite,codesign,reports}

      - name: 分析 valid.sqlite3
        run: |
          if [ -f valid.sqlite3 ]; then
            echo "=== valid.sqlite3 分析 ==="
            sqlite3 valid.sqlite3 ".tables" > output/sqlite/tables.txt 2>&1
            sqlite3 valid.sqlite3 ".schema" > output/sqlite/schema.txt 2>&1
            for TABLE in $(sqlite3 valid.sqlite3 ".tables" 2>/dev/null); do
              sqlite3 valid.sqlite3 "SELECT * FROM $TABLE;" 2>/dev/null | head -200 > output/sqlite/${TABLE}.txt
            done
            cat output/sqlite/tables.txt
          else
            echo "未找到 valid.sqlite3"
          fi

      - name: 分析 com.apple.tips 签名
        run: |
          CODESIGN_DIR=$(find . -path "*/_CodeSignature" -type d 2>/dev/null | head -1)
          APP_DIR=$(dirname "$CODESIGN_DIR")
          
          echo "=== com.apple.tips 签名分析 ==="
          echo "路径: $APP_DIR"
          
          if [ -d "$APP_DIR" ]; then
            ls -la "$APP_DIR" > output/codesign/directory.txt 2>&1
            
            # 应用签名信息
            codesign -dvvv "$APP_DIR" > output/codesign/app_signature.txt 2>&1 || true
            
            # 提取证书到目录
            mkdir -p output/codesign/certs
            codesign -d --extract-certs output/codesign/certs "$APP_DIR" 2>&1 || true
            
            # 分析每个证书
            for CERT in $(ls output/codesign/certs/codesign* 2>/dev/null); do
              if [ -f "$CERT" ]; then
                echo "=== 证书: $(basename $CERT) ===" >> output/codesign/cert_details.txt
                openssl x509 -inform DER -in "$CERT" -text -noout 2>/dev/null >> output/codesign/cert_details.txt || true
              fi
            done
            
            # CMS 签名
            security cms -D -i "$APP_DIR" > output/codesign/cms_signature.txt 2>&1 || true
            
            # TeamID
            codesign -dv "$APP_DIR" 2>&1 | grep -iE "TeamIdentifier|Authority|Identifier" > output/codesign/teamid.txt || true
            
            # OID
            grep -E "OID|1\.2\.840|1\.3\.6\.1" output/codesign/cms_signature.txt 2>/dev/null | head -50 > output/codesign/oid.txt || true
            
            # CodeResources
            if [ -f "$CODESIGN_DIR/CodeResources" ]; then
              python3 -c "
import plistlib
with open('$CODESIGN_DIR/CodeResources', 'rb') as f:
    data = plistlib.load(f)
print('=== 顶层键 ===')
for k in data.keys():
    print(f'  {k}')
if 'files' in data:
    print('\n=== files 条目 ===')
    for name, info in list(data['files'].items())[:20]:
        print(f'  {name}: {info}')
" > output/codesign/coderesources.txt 2>&1 || true
            fi
            
            cat output/codesign/app_signature.txt
            echo "==="
            cat output/codesign/teamid.txt
            echo "==="
            cat output/codesign/oid.txt
          else
            echo "未找到 com.apple.tips 应用"
          fi

      - name: 下载 IPSW 并提取 launchd
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ipsw extract --files --pattern 'launchd$' --flat -o output/launchd firmware.ipsw 2>&1 || true
          ipsw extract --files --pattern 'TrustCache' -o output/kernel firmware.ipsw 2>&1 || true
          find output/launchd output/kernel -type f 2>/dev/null

      - name: 准备内核缓存
        run: |
          KERNELCACHE=$(find . -name "kernelcache*" -type f ! -name "*.txt" ! -name "*.md" 2>/dev/null | head -1)
          if [ -n "$KERNELCACHE" ]; then
            file "$KERNELCACHE"
            if file "$KERNELCACHE" | grep -q "lzfse"; then
              lzfse -decode -i "$KERNELCACHE" -o output/kernel/kernelcache.dec
            elif file "$KERNELCACHE" | grep -q "img4"; then
              ipsw img4 extract --im4p -o output/kernel "$KERNELCACHE" 2>&1 || true
              if [ -f output/kernel/payload ]; then
                mv output/kernel/payload output/kernel/kernelcache.dec
              fi
            else
              cp "$KERNELCACHE" output/kernel/kernelcache.dec
            fi
            echo "KERNEL_TARGET=output/kernel/kernelcache.dec" >> $GITHUB_ENV
          fi

      - name: 搜索 TrustCache/AppleImage4/AMFI
        run: |
          if [ -n "$KERNEL_TARGET" ] && [ -f "$KERNEL_TARGET" ]; then
            strings -t x "$KERNEL_TARGET" | grep -iE "trustcache|TrustCache" > output/kernel/strings_trustcache.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "IMG4|IM4P|AppleImage4|im4p_verify|im4p_parse" > output/kernel/strings_img4.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "AMFI|amfi_|AppleMobileFileIntegrity" > output/kernel/strings_amfi.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "cdhash|CDHash|TeamID|team_id|OID|1\.2\.840" > output/kernel/strings_teamid.txt 2>&1 || true
            cat output/kernel/strings_trustcache.txt
            echo "---"
            cat output/kernel/strings_img4.txt
          fi

      - name: 分析 launchd
        run: |
          LAUNCHD=$(find output/launchd -type f -name "launchd" 2>/dev/null | head -1)
          if [ -n "$LAUNCHD" ]; then
            file "$LAUNCHD" > output/launchd/info.txt
            nm -C -a "$LAUNCHD" > output/launchd/symbols.txt 2>&1 || true
            nm -u "$LAUNCHD" > output/launchd/imports.txt 2>&1 || true
            strings "$LAUNCHD" | grep -iE "mach_msg|mach_port|task_for_pid|bootstrap|xpc_" | sort -u > output/launchd/vuln_mach.txt 2>&1 || true
            strings "$LAUNCHD" | grep -iE "codesign|signature|verify|cdhash|trustcache|amfi|coretrust" | sort -u > output/launchd/vuln_sign.txt 2>&1 || true
            strings "$LAUNCHD" | grep -iE "TeamID|team_id|OID|1\.2\.840" | sort -u > output/launchd/teamid.txt 2>&1 || true
          fi

      - name: 分析守护进程
        run: |
          for DAEMON in amfid installd trustd; do
            if [ -f "$DAEMON" ]; then
              mkdir -p output/daemons/$DAEMON
              nm -C -a "$DAEMON" > output/daemons/$DAEMON/symbols.txt 2>&1 || true
              nm -gU "$DAEMON" > output/daemons/$DAEMON/exports.txt 2>&1 || true
              nm -u "$DAEMON" > output/daemons/$DAEMON/imports.txt 2>&1 || true
              strings "$DAEMON" | grep -iE "coretrust|trustcache|cdhash|img4|amfi|signature|entitlement|cms|teamid|oid" | sort -u > output/daemons/$DAEMON/trust_strings.txt 2>&1 || true
              strings "$DAEMON" | grep -iE "TeamID|team_id|OID|1\.2\.840|com\.apple" | sort -u > output/daemons/$DAEMON/teamid.txt 2>&1 || true
            fi
          done

      - name: 分析框架
        run: |
          SEC_BIN=$(find extracted_frameworks -type f -name "Security" 2>/dev/null | head -1)
          if [ -n "$SEC_BIN" ]; then
            mkdir -p output/frameworks/security
            nm -gU "$SEC_BIN" > output/frameworks/security/exports.txt 2>&1 || true
            nm -gU "$SEC_BIN" | grep -iE "SecCode|SecTrust|SecRequirement|SecStaticCode|SecTask|SecPolicy|SecCertificate|SecCMS" > output/frameworks/security/api.txt 2>&1 || true
            strings "$SEC_BIN" | grep -iE "coretrust|trustcache|cdhash|signature|verify|cms|pkcs|img4|teamid|oid" | sort -u > output/frameworks/security/trust_strings.txt 2>&1 || true
            strings "$SEC_BIN" | grep -iE "TeamID|team_id|OID|1\.2\.840|com\.apple" | sort -u > output/frameworks/security/teamid.txt 2>&1 || true
          fi
          AMFI_BIN=$(find extracted_frameworks -type f -name "AppleMobileFileIntegrity" 2>/dev/null | head -1)
          if [ -n "$AMFI_BIN" ]; then
            mkdir -p output/frameworks/amfi
            nm -gU "$AMFI_BIN" > output/frameworks/amfi/exports.txt 2>&1 || true
            strings "$AMFI_BIN" | grep -iE "coretrust|trustcache|cdhash|signature|verify|amfi|teamid|oid" | sort -u > output/frameworks/amfi/trust_strings.txt 2>&1 || true
            strings "$AMFI_BIN" | grep -iE "TeamID|team_id|OID|1\.2\.840|com\.apple" | sort -u > output/frameworks/amfi/teamid.txt 2>&1 || true
          fi

      - name: 生成报告
        run: |
          echo "# iOS 18.7.6 完整分析报告" > output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## valid.sqlite3" >> output/reports/FULL_REPORT.md
          cat output/sqlite/tables.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## com.apple.tips 签名" >> output/reports/FULL_REPORT.md
          cat output/codesign/teamid.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## OID" >> output/reports/FULL_REPORT.md
          cat output/codesign/oid.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## 证书详情" >> output/reports/FULL_REPORT.md
          cat output/codesign/cert_details.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## TrustCache" >> output/reports/FULL_REPORT.md
          cat output/kernel/strings_trustcache.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md
          echo "" >> output/reports/FULL_REPORT.md
          echo "## IMG4" >> output/reports/FULL_REPORT.md
          cat output/kernel/strings_img4.txt >> output/reports/FULL_REPORT.md 2>/dev/null || echo "未找到" >> output/reports/FULL_REPORT.md

      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: full_analysis
          path: output/
          retention-days: 90
