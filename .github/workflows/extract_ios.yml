name: 分析 valid.sqlite3 和 com.apple.tips

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装工具
        run: brew install sqlite

      - name: 创建输出目录
        run: mkdir -p output

      - name: 分析 valid.sqlite3
        run: |
          if [ -f valid.sqlite3 ]; then
            echo "=== valid.sqlite3 ===" > output/valid_analysis.txt
            sqlite3 valid.sqlite3 ".tables" >> output/valid_analysis.txt 2>&1
            echo "" >> output/valid_analysis.txt
            sqlite3 valid.sqlite3 ".schema" >> output/valid_analysis.txt 2>&1
            
            for TABLE in $(sqlite3 valid.sqlite3 ".tables" 2>/dev/null); do
              echo "" >> output/valid_analysis.txt
              echo "=== $TABLE 结构 ===" >> output/valid_analysis.txt
              sqlite3 valid.sqlite3 "PRAGMA table_info($TABLE);" >> output/valid_analysis.txt 2>&1 || true
              
              echo "=== $TABLE 行数 ===" >> output/valid_analysis.txt
              sqlite3 valid.sqlite3 "SELECT COUNT(*) FROM $TABLE;" >> output/valid_analysis.txt 2>&1 || true
              
              echo "=== $TABLE 数据 (hex) ===" >> output/valid_analysis.txt
              sqlite3 valid.sqlite3 "SELECT * FROM $TABLE;" 2>/dev/null | head -100 | xxd | head -200 >> output/valid_analysis.txt || true
            done
            
            sqlite3 valid.sqlite3 ".tables" 2>/dev/null | grep -qi "code" && sqlite3 valid.sqlite3 "SELECT hex(cdhash) FROM code LIMIT 50;" 2>/dev/null > output/valid_cdhash.txt || true
            
            sqlite3 valid.sqlite3 ".tables" 2>/dev/null | grep -qi "team" && sqlite3 valid.sqlite3 "SELECT * FROM team;" 2>/dev/null | strings | head -100 > output/valid_team.txt || true
            
            cat output/valid_analysis.txt | head -200
          fi

      - name: 分析 com.apple.tips 签名和证书
        run: |
          APP_DIR="com.apple.tips.app"
          if [ -d "$APP_DIR" ]; then
            echo "=== 签名信息 ===" > output/tips_signature.txt
            codesign -dvvv "$APP_DIR" >> output/tips_signature.txt 2>&1 || true
            
            echo "=== TeamID ===" > output/tips_teamid.txt
            codesign -dv "$APP_DIR" 2>&1 | grep -iE "TeamIdentifier|Authority|Identifier|Signed Time" >> output/tips_teamid.txt || true
            
            EXECUTABLE=$(find "$APP_DIR" -type f -perm +111 -not -name "*.dylib" 2>/dev/null | head -1)
            if [ -z "$EXECUTABLE" ]; then
              EXECUTABLE="$APP_DIR"
            fi
            
            echo "=== CMS 签名详情 ===" > output/tips_cms.txt
            security cms -D -i "$EXECUTABLE" >> output/tips_cms.txt 2>&1 || true
            
            if [ -f "$APP_DIR/embedded.mobileprovision" ]; then
              echo "=== MobileProvision ===" > output/tips_provision.txt
              security cms -D -i "$APP_DIR/embedded.mobileprovision" >> output/tips_provision.txt 2>&1 || true
            fi
            
            grep -E "OID|1.2.840|1.3.6.1" output/tips_cms.txt 2>/dev/null | head -100 > output/tips_oid.txt || true
            grep -E "OID|1.2.840|1.3.6.1" output/tips_signature.txt 2>/dev/null | head -100 >> output/tips_oid.txt || true
            
            grep -iE "TeamIdentifier|Subject|Issuer|OU=" output/tips_cms.txt 2>/dev/null | head -50 > output/tips_cert_teamid.txt || true
            grep -iE "TeamIdentifier|Subject|Issuer|OU=" output/tips_signature.txt 2>/dev/null | head -50 >> output/tips_cert_teamid.txt || true
            
            echo "=== Entitlements ===" > output/tips_entitlements.txt
            codesign -d --entitlements - "$APP_DIR" >> output/tips_entitlements.txt 2>&1 || true
            
            cat output/tips_teamid.txt
            echo "---"
            cat output/tips_oid.txt | head -30
            echo "---"
            cat output/tips_entitlements.txt
          else
            echo "未找到 com.apple.tips.app"
          fi

      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: valid_and_tips_analysis
          path: output/
          retention-days: 90
