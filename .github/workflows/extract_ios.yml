name: Extract iOS Firmware

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Create output directories
        run: |
          mkdir -p ios_extracted/daemons
          mkdir -p ios_extracted/frameworks
          mkdir -p ios_extracted/dyld_cache

      - name: Install ipsw
        run: |
          brew tap blacktop/tap
          brew install ipsw
          ipsw version

      - name: Download firmware manually
        run: |
          # 直接 curl 下载
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Try ipsw extract with automatic keys
        run: |
          # ipsw 会自动获取密钥
          ipsw extract dyld_shared_cache firmware.ipsw -o ios_extracted/dyld_cache/ || echo "提取失败"
          ls -la ios_extracted/dyld_cache/

      - name: If extract failed, try manual decryption
        if: failure()
        run: |
          echo "手动解密..."
          
          # 解压 IPSW
          unzip -q firmware.ipsw -d firmware/
          
          # 找到系统 DMG
          SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          echo "系统 DMG: $SYSTEM_DMG"
          
          # 尝试挂载（可能加密）
          sudo hdiutil attach "$SYSTEM_DMG" -mountpoint /Volumes/System -nobrowse -readonly || {
            echo "DMG 加密，需要密钥"
            exit 1
          }

      - name: Search mounted volume
        if: success()
        run: |
          echo "搜索挂载的卷..."
          ls -la /Volumes/System/
          
          for daemon in amfid installd sandboxd trustd; do
            FOUND=$(sudo find /Volumes/System -name "$daemon" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "找到 $daemon: $FOUND"
              sudo cp "$FOUND" ios_extracted/daemons/
            fi
          done
          
          DYLD=$(sudo find /Volumes/System -name "dyld_shared_cache*" -type f 2>/dev/null | head -1)
          if [ -n "$DYLD" ]; then
            echo "找到 dyld: $DYLD"
            sudo cp "$DYLD" ios_extracted/dyld_cache/
          fi
          
          AMFI=$(sudo find /Volumes/System -type d -name "AppleMobileFileIntegrity.framework" 2>/dev/null | head -1)
          if [ -n "$AMFI" ]; then
            echo "找到 AMFI: $AMFI"
            sudo cp -R "$AMFI" ios_extracted/frameworks/
          fi
          
          SECURITY=$(sudo find /Volumes/System -type d -name "Security.framework" 2>/dev/null | head -1)
          if [ -n "$SECURITY" ]; then
            echo "找到 Security: $SECURITY"
            sudo cp -R "$SECURITY" ios_extracted/frameworks/
          fi
          
          sudo hdiutil detach /Volumes/System -force

      - name: Last resort - extract strings from IPSW
        if: always()
        run: |
          echo "从 IPSW 提取字符串..."
          strings firmware.ipsw | grep -E "amfid|installd|sandboxd|trustd|AMFI|Security|com.apple.amfi|com.apple.sandbox" > ios_extracted/ipsw_strings.txt || true
          echo "提取了 $(wc -l < ios_extracted/ipsw_strings.txt) 行字符串"

      - name: Fix permissions
        run: |
          sudo chown -R $(whoami) ios_extracted/ || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted
          path: ios_extracted/
          retention-days: 7
