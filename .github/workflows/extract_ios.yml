name: Extract iOS Firmware (Auto Decrypt)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Create output directories
        run: |
          mkdir -p ios_extracted/daemons
          mkdir -p ios_extracted/frameworks
          mkdir -p ios_extracted/dyld_cache

      - name: Install ipsw
        run: |
          brew tap blacktop/tap
          brew install ipsw
          ipsw version

      - name: Download firmware with keys
        run: |
          # 尝试下载并自动获取密钥
          ipsw download iPhone11,2 --version 18.7.6 --keys -o firmware.ipsw
          ls -lh firmware.ipsw

      - name: Try to extract dyld cache
        run: |
          # ipsw 会自动使用密钥解密
          ipsw extract dyld_shared_cache firmware.ipsw -o ios_extracted/dyld_cache/ || {
            echo "自动提取失败，尝试手动解密"
            exit 1
          }

      - name: Extract daemons if dyld cache exists
        run: |
          DYLD=$(find ios_extracted/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          if [ -n "$DYLD" ]; then
            for daemon in amfid installd sandboxd trustd; do
              ipsw dyld extract "$DYLD" --extract "$daemon" --output ios_extracted/daemons/
            done
          fi

      - name: Extract frameworks if dyld cache exists
        run: |
          DYLD=$(find ios_extracted/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          if [ -n "$DYLD" ]; then
            ipsw dyld extract "$DYLD" --extract "AppleMobileFileIntegrity" --output ios_extracted/frameworks/
            ipsw dyld extract "$DYLD" --extract "Security" --output ios_extracted/frameworks/
          fi

      - name: Fallback - Manual decryption
        if: failure()
        run: |
          echo "=== 手动解密模式 ==="
          
          # 解压 IPSW
          unzip -q firmware.ipsw -d firmware/
          
          # 找到系统 DMG
          SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          echo "系统 DMG: $SYSTEM_DMG"
          
          # 尝试从 ipsw.me API 获取密钥
          curl -s "https://api.ipsw.me/v2.1/firmwares/iPhone11,2/18.7.6/22H320" > keys.json
          
          IV=$(cat keys.json | grep -o '"iv":"[^"]*"' | cut -d'"' -f4)
          KEY=$(cat keys.json | grep -o '"key":"[^"]*"' | cut -d'"' -f4)
          
          if [ -n "$IV" ] && [ -n "$KEY" ]; then
            echo "获取到密钥，开始解密..."
            
            # 安装解密工具
            brew install img4tool
            pip3 install pyimg4
            
            # 解密
            img4tool -d "$SYSTEM_DMG" -o decrypted.dmg -i "$IV" -k "$KEY"
            
            # 挂载
            sudo hdiutil attach decrypted.dmg -mountpoint /Volumes/System -nobrowse
            
            # 复制文件
            for daemon in amfid installd sandboxd trustd; do
              FOUND=$(sudo find /Volumes/System -name "$daemon" -type f 2>/dev/null | head -1)
              if [ -n "$FOUND" ]; then
                sudo cp "$FOUND" ios_extracted/daemons/
              fi
            done
            
            sudo hdiutil detach /Volumes/System -force
          else
            echo "无法获取密钥，固件可能未公开"
          fi

      - name: Extract strings directly from IPSW (last resort)
        if: failure()
        run: |
          echo "=== 从 IPSW 直接提取字符串 ==="
          strings firmware.ipsw | grep -E "amfid|installd|sandboxd|trustd|AMFI|Security|com.apple.amfi|com.apple.sandbox" > ios_extracted/ipsw_strings.txt
          echo "提取了 $(wc -l < ios_extracted/ipsw_strings.txt) 行关键字符串"

      - name: Fix permissions
        run: |
          sudo chown -R $(whoami) ios_extracted/ || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted
          path: ios_extracted/
          retention-days: 7
