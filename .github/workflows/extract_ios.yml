name: 分析 valid.sqlite3 和 com.apple.tips

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          brew install sqlite
          brew tap blacktop/tap && brew install ipsw

      - name: 创建输出目录
        run: mkdir -p output/{sqlite,tips,app}

      - name: 分析 valid.sqlite3
        run: |
          if [ -f valid.sqlite3 ]; then
            echo "=== 表列表 ===" > output/sqlite/tables.txt
            sqlite3 valid.sqlite3 ".tables" >> output/sqlite/tables.txt 2>&1
            
            echo "=== 完整结构 ===" > output/sqlite/schema.txt
            sqlite3 valid.sqlite3 ".schema" >> output/sqlite/schema.txt 2>&1
            
            for TABLE in $(sqlite3 valid.sqlite3 ".tables" 2>/dev/null); do
              echo "=== $TABLE ===" >> output/sqlite/all_data.txt
              sqlite3 valid.sqlite3 "PRAGMA table_info($TABLE);" >> output/sqlite/all_data.txt 2>&1
              sqlite3 valid.sqlite3 "SELECT * FROM $TABLE;" 2>/dev/null | xxd | head -200 >> output/sqlite/all_data.txt
            done
            
            sqlite3 valid.sqlite3 ".tables" 2>/dev/null | grep -qi "code" && sqlite3 valid.sqlite3 "SELECT hex(cdhash) FROM code LIMIT 50;" 2>/dev/null > output/sqlite/cdhash.txt || true
            sqlite3 valid.sqlite3 ".tables" 2>/dev/null | grep -qi "team" && sqlite3 valid.sqlite3 "SELECT * FROM team;" 2>/dev/null | strings | head -100 > output/sqlite/team.txt || true
          fi

      - name: 分析 com.apple.tips.txt
        run: |
          if [ -f "com.apple.tips.txt" ]; then
            strings "com.apple.tips.txt" | grep -iE "TeamIdentifier|Authority|Identifier" > output/tips/teamid.txt || true
            strings "com.apple.tips.txt" | grep -E "OID|1.2.840|1.3.6.1" | head -100 > output/tips/oid.txt || true
            strings "com.apple.tips.txt" | grep -iE "Subject|Issuer|OU=|CN=" | head -100 > output/tips/cert.txt || true
            strings "com.apple.tips.txt" > output/tips/all_strings.txt || true
          fi

      - name: 下载 IPSW 并提取 com.apple.tips.app
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          
          echo "=== 提取 com.apple.tips.app ==="
          ipsw extract --files --pattern 'com.apple.tips.app/' -o output/app firmware.ipsw 2>&1 || true
          ipsw extract --files --pattern 'com.apple.tips' -o output/app firmware.ipsw 2>&1 || true
          
          echo "=== 提取结果 ==="
          find output/app -type f 2>/dev/null | head -50
          find output/app -type d 2>/dev/null | head -50

      - name: 分析固件中的 com.apple.tips.app
        run: |
          APP_DIR=$(find output/app -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find output/app -type d -name "*Tips*" 2>/dev/null | head -1)
          fi
          
          if [ -n "$APP_DIR" ]; then
            echo "=== 找到 App: $APP_DIR ==="
            
            codesign -dvvv "$APP_DIR" > output/app/signature.txt 2>&1 || true
            
            codesign -dv "$APP_DIR" 2>&1 | grep -iE "TeamIdentifier|Authority|Identifier" > output/app/teamid.txt || true
            
            security cms -D -i "$APP_DIR" > output/app/cms.txt 2>&1 || true
            
            grep -E "OID|1.2.840|1.3.6.1" output/app/cms.txt 2>/dev/null | head -100 > output/app/oid.txt || true
            
            grep -iE "Subject|Issuer|OU=" output/app/cms.txt 2>/dev/null | head -50 > output/app/cert.txt || true
            
            codesign -d --entitlements - "$APP_DIR" > output/app/entitlements.txt 2>&1 || true
            
            cat output/app/teamid.txt
            echo "---"
            cat output/app/oid.txt | head -30
          else
            echo "未找到 App 目录"
          fi

      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: full_analysis
          path: output/
          retention-days: 90
