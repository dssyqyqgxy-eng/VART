name: 分析 valid.sqlite3 和 com.apple.tips

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装工具
        run: brew install sqlite

      - name: 创建输出目录
        run: mkdir -p output

      - name: 分析 valid.sqlite3
        run: |
          if [ -f valid.sqlite3 ]; then
            echo "=== valid.sqlite3 ===" > output/valid_analysis.txt
            sqlite3 valid.sqlite3 ".tables" >> output/valid_analysis.txt 2>&1
            echo "" >> output/valid_analysis.txt
            sqlite3 valid.sqlite3 ".schema" >> output/valid_analysis.txt 2>&1
            for TABLE in $(sqlite3 valid.sqlite3 ".tables" 2>/dev/null); do
              echo "" >> output/valid_analysis.txt
              echo "=== $TABLE ===" >> output/valid_analysis.txt
              sqlite3 valid.sqlite3 "SELECT * FROM $TABLE;" 2>/dev/null | head -500 >> output/valid_analysis.txt
            done
            cat output/valid_analysis.txt | head -200
          fi

      - name: 分析 com.apple.tips 签名和证书
        run: |
          CODESIGN_DIR=$(find . -path "*_CodeSignature" -type d 2>/dev/null | head -1)
          if [ -n "$CODESIGN_DIR" ]; then
            APP_DIR=$(dirname "$CODESIGN_DIR")
            codesign -dvvv "$APP_DIR" > output/tips_signature.txt 2>&1 || true
            codesign -dv "$APP_DIR" 2>&1 | grep -iE "TeamIdentifier|Authority|Identifier|Signed Time" > output/tips_teamid.txt || true
            security cms -D -i "$APP_DIR" > output/tips_cms.txt 2>&1 || true
            grep -E "OID|1.2.840|1.3.6.1" output/tips_cms.txt 2>/dev/null | head -100 > output/tips_oid.txt || true
            grep -iE "TeamIdentifier|Subject|Issuer|OU=" output/tips_cms.txt 2>/dev/null | head -50 > output/tips_cert_teamid.txt || true
            cat output/tips_teamid.txt
          fi

      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: valid_and_tips_analysis
          path: output/
          retention-days: 90
