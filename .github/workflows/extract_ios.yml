name: Extract iOS Firmware Components

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      device:
        description: '设备型号'
        required: false
        default: 'iPhone11,2'
      version:
        description: 'iOS 版本'
        required: false
        default: '18.7.6'

env:
  DEVICE: ${{ github.event.inputs.device || 'iPhone11,2' }}
  VERSION: ${{ github.event.inputs.version || '18.7.6' }}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create output directories
        run: mkdir -p ios_extracted/{daemons,frameworks,dyld_cache}
      
      # ========== 方法1: 使用 GitHub 代理下载 ipsw ==========
      - name: Install ipsw via proxy
        run: |
          echo "下载 ipsw..."
          
          # 使用 ghproxy 代理下载（绕过网络限制）
          curl -L -o ipsw.tar.gz \
            https://ghproxy.net/https://github.com/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.tar.gz
          
          # 检查文件大小（应该大于 10MB）
          FILE_SIZE=$(stat -c%s ipsw.tar.gz 2>/dev/null || stat -f%z ipsw.tar.gz 2>/dev/null)
          echo "文件大小: $FILE_SIZE 字节"
          
          if [ -f "ipsw.tar.gz" ] && [ "$FILE_SIZE" -gt 10000000 ]; then
            tar -xzf ipsw.tar.gz
            sudo mv ipsw /usr/local/bin/
            chmod +x /usr/local/bin/ipsw
            rm -f ipsw.tar.gz
            echo "✅ ipsw 安装成功"
            ipsw version
          else
            echo "❌ 下载失败，文件太小"
            exit 1
          fi
      
      # ========== 方法2: 使用 cdn 镜像 ==========
      - name: Install ipsw (mirror fallback)
        if: failure()
        run: |
          echo "使用镜像下载..."
          
          # 使用 fastgit 镜像
          wget https://hub.fastgit.xyz/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.tar.gz
          
          FILE_SIZE=$(stat -c%s ipsw_3.1.628_linux_amd64.tar.gz 2>/dev/null || echo 0)
          
          if [ "$FILE_SIZE" -gt 10000000 ]; then
            tar -xzf ipsw_*.tar.gz
            sudo mv ipsw /usr/local/bin/
            chmod +x /usr/local/bin/ipsw
            rm -f ipsw_*.tar.gz
            echo "✅ ipsw 安装成功"
          else
            echo "❌ 镜像下载也失败"
            exit 1
          fi
      
      # ========== 检查固件版本 ==========
      - name: Check firmware version
        run: |
          echo "设备: $DEVICE"
          echo "版本: $VERSION"
          
          # 列出可用的版本
          echo "可用的 iOS 版本:"
          ipsw download --list --device $DEVICE 2>/dev/null | head -20
      
      # ========== 下载固件 ==========
      - name: Download firmware
        run: |
          # 尝试下载指定版本
          if ipsw download $DEVICE --version $VERSION -o firmware.ipsw 2>&1; then
            echo "✅ 下载成功: $VERSION"
          else
            echo "⚠️ 版本 $VERSION 不存在，尝试下载最新版..."
            # 获取最新版本
            LATEST=$(ipsw download --list --device $DEVICE 2>/dev/null | grep -E "iOS [0-9]" | head -1 | awk '{print $2}')
            echo "最新版本: $LATEST"
            ipsw download $DEVICE --version $LATEST -o firmware.ipsw
            echo "LATEST_VERSION=$LATEST" >> $GITHUB_ENV
          fi
          
          ls -lh firmware.ipsw
        continue-on-error: true
      
      # ========== 提取 dyld 缓存 ==========
      - name: Extract dyld cache
        run: |
          if [ ! -f "firmware.ipsw" ]; then
            echo "没有固件文件"
            exit 0
          fi
          
          # 解压 IPSW
          unzip -q -o firmware.ipsw -d firmware/
          
          # 查找系统 DMG
          SYSTEM_DMG=$(find firmware -name "*.dmg" | grep -E "(_System|_.*_.*\.dmg)" | head -1)
          
          if [ -z "$SYSTEM_DMG" ]; then
            SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          fi
          
          echo "系统 DMG: $SYSTEM_DMG"
          
          # 提取 dyld 缓存
          ipsw extract dyld_shared_cache "$SYSTEM_DMG" -o ios_extracted/dyld_cache/ || true
          
          # 显示结果
          find ios_extracted -name "dyld_shared_cache*" -type f -exec ls -lh {} \;
        continue-on-error: true
      
      # ========== 提取守护进程 ==========
      - name: Extract daemons
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            echo "未找到 dyld 缓存"
            exit 0
          fi
          
          echo "缓存文件: $DYLD"
          
          for daemon in amfid installd sandboxd trustd; do
            echo "提取 $daemon..."
            ipsw dyld extract "$DYLD" --extract "$daemon" --output ios_extracted/daemons/ 2>/dev/null || echo "  跳过"
          done
          
          echo "提取结果:"
          ls -la ios_extracted/daemons/ 2>/dev/null || echo "  无文件"
      
      # ========== 提取框架 ==========
      - name: Extract frameworks
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            exit 0
          fi
          
          # 尝试提取 AMFI
          for name in AppleMobileFileIntegrity AMFI; do
            ipsw dyld extract "$DYLD" --extract "$name" --output ios_extracted/frameworks/ 2>/dev/null || true
          done
          
          # 尝试提取 Security
          for name in Security libsecurity; do
            ipsw dyld extract "$DYLD" --extract "$name" --output ios_extracted/frameworks/ 2>/dev/null || true
          done
          
          ls -la ios_extracted/frameworks/ 2>/dev/null
      
      # ========== 如果都失败，使用 strings 直接分析 dyld 缓存 ==========
      - name: Fallback - extract strings from dyld cache
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -n "$DYLD" ]; then
            echo "从 dyld 缓存提取字符串..."
            
            # 提取关键字符串
            strings "$DYLD" | grep -E "(amfid|installd|sandboxd|trustd|AMFI|Security|com.apple.amfi|com.apple.sandbox)" | head -200 > ios_extracted/key_strings.txt
            
            echo "字符串提取完成"
            wc -l ios_extracted/key_strings.txt
          fi
      
      # ========== 打包 ==========
      - name: Package results
        run: |
          if [ -d "ios_extracted" ] && [ "$(ls -A ios_extracted 2>/dev/null)" ]; then
            tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted/
            echo "✅ 打包完成"
            ls -lh ios_extracted_*.tar.gz
          else
            echo "创建占位文件"
            echo "提取失败或没有文件" > ios_extracted_${DEVICE}_${VERSION}.txt
            tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted_*.txt
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted_${{ env.DEVICE }}_${{ env.VERSION }}
          path: ios_extracted_*.tar.gz
          retention-days: 7
