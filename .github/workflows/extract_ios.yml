name: Extract iOS Firmware Components

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DEVICE: "iPhone11,2"
  VERSION: "18.7.6"

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create output directories
        run: |
          mkdir -p ios_extracted/{daemons,frameworks,dyld_cache,symbols}
          echo "输出目录创建完成"
      
      - name: Install ipsw
        run: |
          echo "安装 ipsw..."
          brew tap blacktop/tap
          brew install ipsw
          ipsw version
          echo "✅ ipsw 安装完成"
      
      - name: Show available firmwares
        run: |
          echo "设备: $DEVICE"
          echo "版本: $VERSION"
          echo ""
          echo "可用的 iOS 版本:"
          ipsw download --list --device $DEVICE 2>/dev/null | head -20 || echo "无法获取列表"
      
      - name: Download firmware
        run: |
          echo "下载固件 ${DEVICE}_${VERSION}..."
          ipsw download $DEVICE --version $VERSION -o firmware.ipsw
          
          if [ -f "firmware.ipsw" ]; then
            SIZE=$(ls -lh firmware.ipsw | awk '{print $5}')
            echo "✅ 下载完成: $SIZE"
          else
            echo "❌ 下载失败"
          fi
        continue-on-error: true
      
      - name: Extract dyld cache
        run: |
          if [ ! -f "firmware.ipsw" ]; then
            echo "固件文件不存在，跳过"
            exit 0
          fi
          
          echo "解压 IPSW..."
          unzip -q firmware.ipsw -d firmware/
          
          echo "查找系统 DMG..."
          SYSTEM_DMG=$(find firmware -name "*.dmg" | grep -E "_System|_OS" | head -1)
          
          if [ -z "$SYSTEM_DMG" ]; then
            SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          fi
          
          echo "系统 DMG: $SYSTEM_DMG"
          
          # 挂载 DMG
          echo "挂载 DMG..."
          hdiutil attach "$SYSTEM_DMG" -mountpoint /Volumes/System -nobrowse
          
          # 复制 dyld 缓存
          if [ -f "/Volumes/System/System/Library/dyld/dyld_shared_cache_arm64e" ]; then
            cp /Volumes/System/System/Library/dyld/dyld_shared_cache_arm64e ios_extracted/dyld_cache/
            echo "✅ 复制 dyld_shared_cache_arm64e"
          elif [ -f "/Volumes/System/System/Library/dyld/dyld_shared_cache_arm64" ]; then
            cp /Volumes/System/System/Library/dyld/dyld_shared_cache_arm64 ios_extracted/dyld_cache/
            echo "✅ 复制 dyld_shared_cache_arm64"
          else
            echo "⚠️ 未找到 dyld 缓存"
          fi
          
          # 卸载 DMG
          hdiutil detach /Volumes/System || true
        continue-on-error: true
      
      - name: Extract daemons
        run: |
          # 重新挂载系统 DMG
          SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          hdiutil attach "$SYSTEM_DMG" -mountpoint /Volumes/System -nobrowse 2>/dev/null || true
          
          echo "复制守护进程..."
          
          for daemon in amfid installd sandboxd trustd; do
            if [ -f "/Volumes/System/usr/libexec/$daemon" ]; then
              cp "/Volumes/System/usr/libexec/$daemon" ios_extracted/daemons/
              SIZE=$(ls -lh ios_extracted/daemons/$daemon | awk '{print $5}')
              echo "✅ $daemon ($SIZE)"
            else
              echo "⚠️ 未找到 $daemon"
            fi
          done
          
          # 也检查 /sbin 和 /usr/bin
          for daemon in launchd sandboxd; do
            if [ -f "/Volumes/System/sbin/$daemon" ]; then
              cp "/Volumes/System/sbin/$daemon" ios_extracted/daemons/ 2>/dev/null || true
            fi
            if [ -f "/Volumes/System/usr/bin/$daemon" ]; then
              cp "/Volumes/System/usr/bin/$daemon" ios_extracted/daemons/ 2>/dev/null || true
            fi
          done
          
          hdiutil detach /Volumes/System || true
          
          echo ""
          echo "提取的守护进程:"
          ls -la ios_extracted/daemons/
        continue-on-error: true
      
      - name: Extract frameworks
        run: |
          SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          hdiutil attach "$SYSTEM_DMG" -mountpoint /Volumes/System -nobrowse 2>/dev/null || true
          
          echo "复制框架..."
          
          # AMFI 框架
          if [ -d "/Volumes/System/System/Library/PrivateFrameworks/AppleMobileFileIntegrity.framework" ]; then
            cp -R "/Volumes/System/System/Library/PrivateFrameworks/AppleMobileFileIntegrity.framework" ios_extracted/frameworks/
            echo "✅ AMFI 框架"
          fi
          
          # Security 框架
          if [ -d "/Volumes/System/System/Library/Frameworks/Security.framework" ]; then
            cp -R "/Volumes/System/System/Library/Frameworks/Security.framework" ios_extracted/frameworks/
            echo "✅ Security 框架"
          fi
          
          # IOKit 框架（可选）
          if [ -d "/Volumes/System/System/Library/Frameworks/IOKit.framework" ]; then
            cp -R "/Volumes/System/System/Library/Frameworks/IOKit.framework" ios_extracted/frameworks/
            echo "✅ IOKit 框架"
          fi
          
          hdiutil detach /Volumes/System || true
          
          echo ""
          echo "提取的框架:"
          ls -la ios_extracted/frameworks/
        continue-on-error: true
      
      - name: Extract strings and symbols
        run: |
          echo "提取字符串和符号..."
          
          # 从守护进程提取字符串
          for daemon in amfid installd sandboxd trustd; do
            if [ -f "ios_extracted/daemons/$daemon" ]; then
              strings ios_extracted/daemons/$daemon > ios_extracted/symbols/${daemon}_all_strings.txt 2>/dev/null || true
              strings ios_extracted/daemons/$daemon | grep -E "com.apple|XPC|entitlement|AMFI|sandbox|version|error" > ios_extracted/symbols/${daemon}_key_strings.txt 2>/dev/null || true
              echo "✅ $daemon: $(wc -l < ios_extracted/symbols/${daemon}_all_strings.txt) 字符串"
            fi
          done
          
          # 从 dyld 缓存提取关键字符串
          DYLD=$(find ios_extracted/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          if [ -n "$DYLD" ]; then
            strings "$DYLD" | grep -E "amfid|installd|sandboxd|trustd|AMFI" > ios_extracted/symbols/dyld_key_strings.txt 2>/dev/null || true
            echo "✅ dyld 关键字符串: $(wc -l < ios_extracted/symbols/dyld_key_strings.txt)"
          fi
      
      - name: Generate extraction report
        run: |
          cat > ios_extracted/README.md << 'EOF'
          # iOS 固件提取报告
          
          ## 提取信息
          
          EOF
          
          echo "- **设备**: $DEVICE" >> ios_extracted/README.md
          echo "- **iOS 版本**: $VERSION" >> ios_extracted/README.md
          echo "- **提取时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ios_extracted/README.md
          echo "- **运行 ID**: ${{ github.run_id }}" >> ios_extracted/README.md
          echo "- **运行编号**: ${{ github.run_number }}" >> ios_extracted/README.md
          
          echo "" >> ios_extracted/README.md
          echo "## 提取的文件" >> ios_extracted/README.md
          echo "" >> ios_extracted/README.md
          
          echo "### 守护进程" >> ios_extracted/README.md
          for f in ios_extracted/daemons/*; do
            if [ -f "$f" ]; then
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "- $name ($size)" >> ios_extracted/README.md
            fi
          done
          
          echo "" >> ios_extracted/README.md
          echo "### 框架" >> ios_extracted/README.md
          for f in ios_extracted/frameworks/*; do
            if [ -d "$f" ]; then
              size=$(du -sh "$f" | cut -f1)
              name=$(basename "$f")
              echo "- $name ($size)" >> ios_extracted/README.md
            fi
          done
          
          echo "" >> ios_extracted/README.md
          echo "### dyld 缓存" >> ios_extracted/README.md
          for f in ios_extracted/dyld_cache/*; do
            if [ -f "$f" ]; then
              size=$(ls -lh "$f" | awk '{print $5}')
              name=$(basename "$f")
              echo "- $name ($size)" >> ios_extracted/README.md
            fi
          done
          
          echo "" >> ios_extracted/README.md
          echo "## 字符串提取" >> ios_extracted/README.md
          echo "" >> ios_extracted/README.md
          echo "| 文件 | 字符串数 |" >> ios_extracted/README.md
          echo "|------|----------|" >> ios_extracted/README.md
          
          for f in ios_extracted/symbols/*_all_strings.txt; do
            if [ -f "$f" ]; then
              count=$(wc -l < "$f")
              name=$(basename "$f" | sed 's/_all_strings.txt//')
              echo "| $name | $count |" >> ios_extracted/README.md
            fi
          done
          
          echo "" >> ios_extracted/README.md
          echo "## 目录结构" >> ios_extracted/README.md
          echo '```' >> ios_extracted/README.md
          find ios_extracted -type f -not -name "README.md" | head -50 >> ios_extracted/README.md
          echo '```' >> ios_extracted/README.md
          
          echo "报告生成完成"
          cat ios_extracted/README.md
      
      - name: Package results
        run: |
          echo "打包提取的文件..."
          tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted/
          PACKAGE_SIZE=$(ls -lh ios_extracted_${DEVICE}_${VERSION}.tar.gz | awk '{print $5}')
          echo "✅ 打包完成: $PACKAGE_SIZE"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted_${{ env.DEVICE }}_${{ env.VERSION }}
          path: |
            ios_extracted_*.tar.gz
            ios_extracted/README.md
          retention-days: 7
          compression-level: 6
      
      - name: Commit report to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只提交报告文件（不提交大文件）
          git add ios_extracted/README.md ios_extracted/symbols/*_key_strings.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有新文件需要提交"
          else
            git commit -m "🤖 自动提取 iOS $VERSION 固件组件 [skip ci]"
            git push
            echo "✅ 已推送到仓库"
          fi
        continue-on-error: true
      
      - name: Completion
        run: |
          echo ""
          echo "========================================="
          echo "✅ 提取完成！"
          echo "========================================="
          echo ""
          echo "📊 提取结果:"
          echo "   守护进程: $(ls -1 ios_extracted/daemons/ 2>/dev/null | wc -l) 个"
          echo "   框架: $(ls -1 ios_extracted/frameworks/ 2>/dev/null | wc -l) 个"
          echo "   总大小: $(du -sh ios_extracted/ | cut -f1)"
          echo ""
          echo "📦 下载方式:"
          echo "   1. Actions → 点击运行 → Artifacts"
          echo "   2. 下载: ios_extracted_${DEVICE}_${VERSION}.tar.gz"
          echo ""
          echo "📁 或在仓库中查看:"
          echo "   ios_extracted/README.md"
          echo "   ios_extracted/symbols/*_key_strings.txt"
