name: Extract iOS Firmware Components

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      device:
        description: '设备型号'
        required: false
        default: 'iPhone11,2'
      version:
        description: 'iOS 版本'
        required: false
        default: '18.7.6'

env:
  DEVICE: ${{ github.event.inputs.device || 'iPhone11,2' }}
  VERSION: ${{ github.event.inputs.version || '18.7.6' }}

jobs:
  extract:
    name: Extract iOS Components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create output directories
        run: |
          mkdir -p ios_extracted/{daemons,frameworks,dyld_cache}
          echo "输出目录创建完成"
      
      # ========== 修复：多种方式安装 ipsw ==========
      - name: Install ipsw (multiple methods)
        run: |
          echo "尝试安装 ipsw..."
          
          # 方法1: 使用 wget 下载（带重试）
          echo "方法1: 下载预编译二进制..."
          for i in {1..3}; do
            echo "尝试第 $i 次..."
            if wget --timeout=30 --tries=3 -q https://github.com/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.tar.gz; then
              echo "下载成功"
              break
            fi
            sleep 5
          done
          
          if [ -f "ipsw_3.1.628_linux_amd64.tar.gz" ]; then
            tar -xzf ipsw_*.tar.gz
            sudo mv ipsw /usr/local/bin/
            chmod +x /usr/local/bin/ipsw
            rm -f ipsw_*.tar.gz
            echo "✅ ipsw 安装成功（方法1）"
          else
            echo "方法1失败，尝试方法2..."
            
            # 方法2: 使用 curl 下载
            curl -L -o ipsw.tar.gz https://github.com/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.tar.gz
            if [ -f "ipsw.tar.gz" ]; then
              tar -xzf ipsw.tar.gz
              sudo mv ipsw /usr/local/bin/
              chmod +x /usr/local/bin/ipsw
              rm -f ipsw.tar.gz
              echo "✅ ipsw 安装成功（方法2）"
            else
              echo "方法2失败，尝试方法3..."
              
              # 方法3: 使用 GitHub API 获取最新版本
              LATEST_URL=$(curl -s https://api.github.com/repos/blacktop/ipsw/releases/latest | grep "browser_download_url.*linux_amd64.tar.gz" | cut -d '"' -f 4)
              wget -q "$LATEST_URL" -O ipsw.tar.gz
              tar -xzf ipsw.tar.gz
              sudo mv ipsw /usr/local/bin/
              chmod +x /usr/local/bin/ipsw
              rm -f ipsw.tar.gz
              echo "✅ ipsw 安装成功（方法3）"
            fi
          fi
          
          # 验证
          if command -v ipsw &> /dev/null; then
            echo "✅ ipsw 已安装: $(ipsw version 2>&1 | head -1)"
          else
            echo "❌ ipsw 安装失败"
            exit 1
          fi
      
      # ========== 检查固件 ==========
      - name: Check firmware
        run: |
          echo "设备: $DEVICE"
          echo "版本: $VERSION"
          echo "固件: ${DEVICE}_${VERSION}_Restore.ipsw"
          
          # 测试固件 URL 是否可访问
          echo "检查固件是否可用..."
          
          # 方法1: 使用 ipsw 工具
          if ipsw download --list --device $DEVICE 2>/dev/null | grep -q "$VERSION"; then
            echo "✅ 固件 $VERSION 可用"
          else
            echo "⚠️ 警告: 固件 $VERSION 可能不存在"
            echo "可用的版本:"
            ipsw download --list --device $DEVICE 2>/dev/null | head -10 || echo "无法获取列表"
          fi
        continue-on-error: true
      
      # ========== 提取 dyld 缓存 ==========
      - name: Extract dyld cache
        run: |
          echo "提取 dyld 缓存..."
          
          # 尝试远程提取
          if ipsw extract --dyld --remote ${DEVICE}_${VERSION}_Restore.ipsw -o ios_extracted/dyld_cache/ 2>&1; then
            echo "✅ 远程提取成功"
          else
            echo "⚠️ 远程提取失败，尝试下载完整固件..."
            
            # 下载完整固件
            ipsw download $DEVICE --version $VERSION -o firmware.ipsw || {
              echo "❌ 无法下载固件，版本 $VERSION 可能不存在"
              exit 0
            }
            
            # 解压并提取
            unzip -o firmware.ipsw -d firmware/ || true
            for dmg in firmware/*.dmg; do
              if [ -f "$dmg" ]; then
                ipsw extract dyld_shared_cache "$dmg" -o ios_extracted/dyld_cache/ && break
              fi
            done
          fi
          
          # 查找结果
          find ios_extracted -name "dyld_shared_cache*" -type f
        continue-on-error: true
      
      # ========== 提取守护进程 ==========
      - name: Extract daemons
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            echo "未找到 dyld 缓存，跳过提取"
            exit 0
          fi
          
          echo "使用 dyld 缓存: $DYLD"
          
          for daemon in amfid installd sandboxd trustd; do
            echo "提取 $daemon..."
            ipsw dyld extract "$DYLD" --extract "$daemon" --output ios_extracted/daemons/ 2>/dev/null || true
            
            if [ -f "ios_extracted/daemons/$daemon" ]; then
              size=$(du -h "ios_extracted/daemons/$daemon" | cut -f1)
              echo "  ✅ $daemon ($size)"
            fi
          done
        continue-on-error: true
      
      # ========== 提取框架 ==========
      - name: Extract frameworks
        run: |
          DYLD=$(find ios_extracted -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD" ]; then
            echo "未找到 dyld 缓存，跳过提取"
            exit 0
          fi
          
          # AMFI 框架
          echo "提取 AMFI 框架..."
          ipsw dyld extract "$DYLD" --extract "AppleMobileFileIntegrity.framework/AppleMobileFileIntegrity" --output ios_extracted/frameworks/ 2>/dev/null || true
          ipsw dyld extract "$DYLD" --extract "AppleMobileFileIntegrity" --output ios_extracted/frameworks/ 2>/dev/null || true
          
          # Security 框架
          echo "提取 Security 框架..."
          ipsw dyld extract "$DYLD" --extract "Security.framework/Security" --output ios_extracted/frameworks/ 2>/dev/null || true
          ipsw dyld extract "$DYLD" --extract "Security" --output ios_extracted/frameworks/ 2>/dev/null || true
          
          # 显示结果
          ls -la ios_extracted/frameworks/
        continue-on-error: true
      
      # ========== 生成报告 ==========
      - name: Generate report
        run: |
          cat > ios_extracted/REPORT.md << EOF
          # iOS 固件提取报告
          
          ## 信息
          - **设备**: $DEVICE
          - **iOS 版本**: $VERSION
          - **提取时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **运行 ID**: ${{ github.run_id }}
          
          ## 提取的文件
          
          ### 守护进程
          $(ls -la ios_extracted/daemons/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 " bytes)"}')
          
          ### 框架
          $(ls -la ios_extracted/frameworks/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 " bytes)"}')
          
          ### dyld 缓存
          $(ls -la ios_extracted/dyld_cache/ 2>/dev/null | tail -n +2 | awk '{print "- " $9 " (" $5 " bytes)"}')
          
          ## 使用说明
          \`\`\`bash
          # 解压
          tar -xzf ios_extracted_${DEVICE}_${VERSION}.tar.gz
          
          # 查看文件类型
          file ios_extracted/daemons/*
          
          # 查看字符串
          strings ios_extracted/daemons/amfid | head -50
          \`\`\`
          EOF
          
          cat ios_extracted/REPORT.md
      
      # ========== 打包 ==========
      - name: Package results
        run: |
          if [ -d "ios_extracted" ] && [ "$(ls -A ios_extracted/daemons 2>/dev/null)" ]; then
            tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted/
            echo "✅ 打包完成"
            ls -lh ios_extracted_*.tar.gz
          else
            echo "⚠️ 没有文件可打包"
            # 创建空文件避免失败
            echo "提取失败" > ios_extracted_${DEVICE}_${VERSION}.txt
            tar -czf ios_extracted_${DEVICE}_${VERSION}.tar.gz ios_extracted_*.txt
          fi
      
      # ========== 上传 ==========
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted_${{ env.DEVICE }}_${{ env.VERSION }}
          path: ios_extracted_*.tar.gz
          retention-days: 7
      
      # ========== 完成 ==========
      - name: Completion
        run: |
          echo ""
          echo "========================================="
          echo "✅ 工作流完成"
          echo "========================================="
          echo ""
          echo "📦 下载 Artifact:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
