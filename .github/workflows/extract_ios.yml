name: 分析 valid.sqlite3 和 com.apple.tips

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装工具
        run: brew install sqlite

      - name: 创建输出目录
        run: mkdir -p output

      - name: 列出所有文件
        run: |
          echo "=== 所有文件 ==="
          ls -la
          echo ""
          echo "=== com.apple* ==="
          ls com.apple* 2>/dev/null || echo "未找到 com.apple*"

      - name: 分析 com.apple.tips.txt
        run: |
          TIPS_FILE=$(ls com.apple.tips.txt 2>/dev/null || ls com.apple.tips* 2>/dev/null | head -1)
          if [ -n "$TIPS_FILE" ]; then
            echo "找到: $TIPS_FILE"
            grep -iE "TeamIdentifier|Authority|Identifier" "$TIPS_FILE" > output/tips_teamid.txt || true
            grep -E "OID|1.2.840|1.3.6.1" "$TIPS_FILE" | head -100 > output/tips_oid.txt || true
            grep -iE "Subject|Issuer|OU=" "$TIPS_FILE" | head -50 > output/tips_cert.txt || true
            cat output/tips_teamid.txt
          else
            echo "未找到文件"
            ls -la
          fi

      - name: 分析 valid.sqlite3
        run: |
          if [ -f valid.sqlite3 ]; then
            sqlite3 valid.sqlite3 ".tables" > output/valid_tables.txt 2>&1
            sqlite3 valid.sqlite3 ".schema" > output/valid_schema.txt 2>&1
            cat output/valid_tables.txt
          fi

      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: valid_and_tips_analysis
          path: output/
          retention-days: 90
