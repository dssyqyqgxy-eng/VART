name: CoreTrust 深度分析

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 300

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压框架文件
        run: |
          unzip -q amfid.zip -d extracted_frameworks/ 2>/dev/null || true
          find extracted_frameworks -type f 2>/dev/null

      - name: 安装分析工具
        run: |
          brew install radare2 lzfse capstone keystone binutils
          brew tap blacktop/tap && brew install ipsw
          sudo curl -L -o /usr/local/bin/class-dump https://github.com/AloneMonkey/MonkeyDev/raw/master/bin/class-dump
          sudo chmod +x /usr/local/bin/class-dump

      - name: 创建输出目录
        run: |
          mkdir -p output/{coretrust,disasm,addresses,kexts,daemons,frameworks,reports}

      - name: 准备内核缓存
        run: |
          KERNELCACHE=$(find . -name "kernelcache*" -type f ! -name "*.txt" ! -name "*.md" 2>/dev/null | head -1)
          if [ -n "$KERNELCACHE" ]; then
            if file "$KERNELCACHE" | grep -q "lzfse"; then
              lzfse -decode -i "$KERNELCACHE" -o output/kernelcache.dec
            else
              cp "$KERNELCACHE" output/kernelcache.dec
            fi
            echo "KERNEL_TARGET=output/kernelcache.dec" >> $GITHUB_ENV
          fi

      - name: 提取内核扩展
        run: |
          if [ -n "$KERNEL_TARGET" ] && [ -f "$KERNEL_TARGET" ]; then
            ipsw kernel kexts "$KERNEL_TARGET" > output/kexts/kexts_list.txt 2>&1 || true
          fi

      - name: 搜索 CoreTrust 字符串及偏移
        run: |
          if [ -n "$KERNEL_TARGET" ] && [ -f "$KERNEL_TARGET" ]; then
            strings -t x "$KERNEL_TARGET" | grep -iE "coretrust|CoreTrust" > output/coretrust/strings_coretrust.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "trustcache|TrustCache" > output/coretrust/strings_trustcache.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "IMG4|IM4P|AppleImage4" > output/coretrust/strings_img4.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "cdhash|CDHash" > output/coretrust/strings_cdhash.txt 2>&1 || true
            strings -t x "$KERNEL_TARGET" | grep -iE "AMFI|amfi_" > output/coretrust/strings_amfi.txt 2>&1 || true
          fi

      - name: Radare2 交叉引用分析
        run: |
          if [ -n "$KERNEL_TARGET" ] && [ -f "$KERNEL_TARGET" ]; then
            r2 -q -c 'aaaa; afl' "$KERNEL_TARGET" > output/addresses/all_functions.txt 2>&1 || true
            r2 -q -c 'aaaa; ie' "$KERNEL_TARGET" > output/addresses/entry_points.txt 2>&1 || true
            r2 -q -c 'aaaa; /a coretrust' "$KERNEL_TARGET" > output/coretrust/xrefs_coretrust.txt 2>&1 || true
            r2 -q -c 'aaaa; /a trustcache' "$KERNEL_TARGET" > output/coretrust/xrefs_trustcache.txt 2>&1 || true
            r2 -q -c 'aaaa; /a img4' "$KERNEL_TARGET" > output/coretrust/xrefs_img4.txt 2>&1 || true
            r2 -q -c 'aaaa; /a cdhash' "$KERNEL_TARGET" > output/coretrust/xrefs_cdhash.txt 2>&1 || true
          fi

      - name: 反汇编 CoreTrust 候选函数
        run: |
          if [ -n "$KERNEL_TARGET" ] && [ -f "$KERNEL_TARGET" ]; then
            if [ -s output/coretrust/xrefs_coretrust.txt ]; then
              grep -oP '0x[0-9a-f]+' output/coretrust/xrefs_coretrust.txt | head -10 | while read ADDR; do
                echo "=== $ADDR ===" >> output/disasm/functions.txt
                r2 -q -c "aaaa; s $ADDR; pdf" "$KERNEL_TARGET" >> output/disasm/functions.txt 2>&1 || true
              done
            fi
          fi

      - name: 分析守护进程
        run: |
          for DAEMON in amfid installd trustd; do
            if [ -f "$DAEMON" ]; then
              mkdir -p output/daemons/$DAEMON
              nm -C -a "$DAEMON" > output/daemons/$DAEMON/symbols.txt 2>&1 || true
              nm -gU "$DAEMON" > output/daemons/$DAEMON/exports.txt 2>&1 || true
              nm -u "$DAEMON" | grep -iE "AMFI|Trust|Sign|Verify|Code|Core" > output/daemons/$DAEMON/imports_trust.txt 2>&1 || true
              strings "$DAEMON" | grep -iE "coretrust|trustcache|cdhash|img4|AMFI|signature|entitlement" | sort -u > output/daemons/$DAEMON/trust_strings.txt 2>&1 || true
              strings -n 8 "$DAEMON" | sort -u > output/daemons/$DAEMON/all_strings.txt 2>&1 || true
              r2 -q -c 'aaa; afl' "$DAEMON" > output/daemons/$DAEMON/functions.txt 2>&1 || true
              r2 -q -c 'aaa; s main; pdf' "$DAEMON" > output/daemons/$DAEMON/main_disasm.txt 2>&1 || true
              r2 -q -c 'aaa; aac; pdc @ main' "$DAEMON" > output/daemons/$DAEMON/main_decompiled.c 2>&1 || true
            fi
          done

      - name: 分析框架
        run: |
          SEC_BIN=$(find extracted_frameworks -type f -name "Security" 2>/dev/null | head -1)
          if [ -n "$SEC_BIN" ]; then
            mkdir -p output/frameworks/security
            nm -gU "$SEC_BIN" > output/frameworks/security/exports.txt 2>&1 || true
            nm -gU "$SEC_BIN" | grep -iE "SecCode|SecTrust|SecRequirement|SecStaticCode|SecTask" > output/frameworks/security/api.txt 2>&1 || true
            strings "$SEC_BIN" | grep -iE "coretrust|trustcache|cdhash|signature|verify" | sort -u > output/frameworks/security/trust_strings.txt 2>&1 || true
          fi
          AMFI_BIN=$(find extracted_frameworks -type f -name "AppleMobileFileIntegrity" 2>/dev/null | head -1)
          if [ -n "$AMFI_BIN" ]; then
            mkdir -p output/frameworks/amfi
            nm -gU "$AMFI_BIN" > output/frameworks/amfi/exports.txt 2>&1 || true
            strings "$AMFI_BIN" | grep -iE "coretrust|trustcache|cdhash|signature|verify|amfi" | sort -u > output/frameworks/amfi/trust_strings.txt 2>&1 || true
          fi

      - name: 生成分析报告
        run: |
          echo "# CoreTrust iOS 18.7.6 分析报告" > output/reports/CORETRUST_MAP.md
          echo "" >> output/reports/CORETRUST_MAP.md
          echo "## 代码签名验证流程" >> output/reports/CORETRUST_MAP.md
          echo '```' >> output/reports/CORETRUST_MAP.md
          echo "应用启动 -> 内核 MACH_MSG 到 amfid" >> output/reports/CORETRUST_MAP.md
          echo "amfid -> 读取二进制 + CMS 签名" >> output/reports/CORETRUST_MAP.md
          echo "amfid -> Security.framework (SecCodeCreate, SecCodeCheckValidity)" >> output/reports/CORETRUST_MAP.md
          echo "Security.framework -> 解析 CMS, 提取 CDHash" >> output/reports/CORETRUST_MAP.md
          echo "amfid -> 发送 CDHash 到内核 (AMFI.kext)" >> output/reports/CORETRUST_MAP.md
          echo "AMFI.kext -> 检查 TrustCache" >> output/reports/CORETRUST_MAP.md
          echo "  已缓存 -> 允许" >> output/reports/CORETRUST_MAP.md
          echo "  未缓存 -> AppleImage4 解析 -> CMS 验证 -> CDHash 比对 -> 更新 TrustCache" >> output/reports/CORETRUST_MAP.md
          echo '```' >> output/reports/CORETRUST_MAP.md
          echo "" >> output/reports/CORETRUST_MAP.md
          echo "## CoreTrust 字符串偏移" >> output/reports/CORETRUST_MAP.md
          cat output/coretrust/strings_coretrust.txt >> output/reports/CORETRUST_MAP.md 2>/dev/null || echo "未找到" >> output/reports/CORETRUST_MAP.md
          echo "" >> output/reports/CORETRUST_MAP.md
          echo "## 交叉引用" >> output/reports/CORETRUST_MAP.md
          cat output/coretrust/xrefs_coretrust.txt >> output/reports/CORETRUST_MAP.md 2>/dev/null || echo "未找到" >> output/reports/CORETRUST_MAP.md
          echo "" >> output/reports/CORETRUST_MAP.md
          echo "## 内核扩展" >> output/reports/CORETRUST_MAP.md
          cat output/kexts/kexts_list.txt >> output/reports/CORETRUST_MAP.md 2>/dev/null || echo "未找到" >> output/reports/CORETRUST_MAP.md

      - name: 上传所有分析结果
        uses: actions/upload-artifact@v4
        with:
          name: coretrust_full_analysis
          path: output/
          retention-days: 90
