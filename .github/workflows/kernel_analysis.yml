name: 内核符号分析

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 检查内核文件
        run: |
          echo "=== 当前目录 ==="
          pwd
          echo "=== 文件列表 ==="
          ls -la
          if [ -f kernelcache.release ]; then
            echo "✅ 找到内核文件 ($(ls -lh kernelcache.release | awk '{print $5}'))"
          else
            echo "❌ 未找到 kernelcache.release"
            echo "请确保文件在仓库根目录"
          fi
      
      - name: 运行分析脚本
        run: |
          chmod +x extract_and_upload.sh
          ./extract_and_upload.sh
      
      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: kernel-analysis
          path: kernel_analysis.zip
          retention-days: 90
