name: 内核符号分析

on:
  push:
    branches: [ main ]
    paths:
      - 'kernelcache.release'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 检查内核文件
        run: |
          if [ ! -f kernelcache.release ]; then
            echo "❌ 未找到 kernelcache.release"
            exit 1
          fi
          echo "✅ 找到内核文件 ($(ls -lh kernelcache.release | awk '{print $5}'))"
      
      - name: 运行分析脚本
        run: |
          chmod +x extract_and_upload.sh
          ./extract_and_upload.sh
      
      - name: 上传分析结果
        uses: actions/upload-artifact@v4
        with:
          name: kernel-analysis
          path: kernel_analysis.zip
          retention-days: 90
