name: Test Certificate with codesign/amfid

on:
  push:
    paths:
      - '测试.p12'
  workflow_dispatch:

jobs:
  test-with-amfid:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: brew install openssl

      - name: Extract certificate and private key from P12
        run: |
          echo "============================================================"
          echo "提取证书和私钥"
          echo "============================================================"
          
          # 提取证书
          openssl pkcs12 -in "测试.p12" -nokeys -passin pass:1 -out test.crt
          
          # 提取私钥
          openssl pkcs12 -in "测试.p12" -nocerts -passin pass:1 -passout pass:temp -out test.key
          openssl rsa -in test.key -passin pass:temp -out test.key.pem
          
          echo "✅ 证书和私钥已提取"

      - name: Create test binary
        run: |
          echo ""
          echo "============================================================"
          echo "创建测试二进制文件"
          echo "============================================================"
          
          # 创建一个简单的测试程序
          cat > test.c << 'EOF'
          #include <stdio.h>
          int main() {
              printf("Hello from signed binary\n");
              return 0;
          }
          EOF
          
          gcc test.c -o test_binary
          echo "✅ 测试二进制已创建"

      - name: Sign binary with certificate
        run: |
          echo ""
          echo "============================================================"
          echo "签名测试二进制"
          echo "============================================================"
          
          # 创建临时钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          
          # 导入证书和私钥
          security import test.crt -k build.keychain -P 1 -A
          security import test.key.pem -k build.keychain -P temp -A
          
          # 查找证书标识
          IDENTITY=$(security find-identity -v -p code-signing | head -1 | awk -F '"' '{print $2}')
          echo "找到证书: $IDENTITY"
          
          # 签名
          codesign -s "$IDENTITY" --deep --force test_binary
          echo "✅ 签名完成"

      - name: Verify signature with codesign
        run: |
          echo ""
          echo "============================================================"
          echo "codesign 验证签名"
          echo "============================================================"
          
          codesign -dvvv test_binary
          echo ""
          codesign -vvv test_binary
          echo ""
          if [ $? -eq 0 ]; then
            echo "✅ codesign 验证通过"
          else
            echo "❌ codesign 验证失败"
          fi

      - name: Check amfid behavior (via syslog)
        run: |
          echo ""
          echo "============================================================"
          echo "检查 amfid 日志"
          echo "============================================================"
          
          # 尝试运行签名后的二进制
          ./test_binary
          
          # 检查系统日志中的 amfid 相关信息
          log show --predicate 'process == "amfid"' --last 1m 2>/dev/null || echo "无法读取 amfid 日志（权限不足）"

      - name: Verify with security command
        run: |
          echo ""
          echo "============================================================"
          echo "security 验证"
          echo "============================================================"
          
          security check-signature -v test_binary

      - name: Check certificate trust
        run: |
          echo ""
          echo "============================================================"
          echo "检查证书信任状态"
          echo "============================================================"
          
          # 添加到系统信任（测试用）
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain test.crt 2>/dev/null || echo "需要权限"
          
          # 验证证书
          security verify-cert -c test.crt 2>&1 || echo "证书不受信任"

      - name: Display certificate details
        run: |
          echo ""
          echo "============================================================"
          echo "证书详细信息"
          echo "============================================================"
          openssl x509 -in test.crt -text -noout

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-binary
          path: |
            test_binary
            test.crt
            test.key.pem
