name: Decrypt, Mount All DMGs and Extract

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: |
          brew tap blacktop/tap
          brew install ipsw
          pip3 install pyimg4 --break-system-packages
          ipsw version
          python3 -c "from pyimg4 import IMG4; print('pyimg4 OK')"

      - name: Create output directories
        run: mkdir -p extracted/daemons extracted/frameworks extracted/sandbox extracted/kernel

      - name: Download firmware
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Extract IPSW
        run: |
          unzip -q firmware.ipsw -d firmware/
          ls -lh firmware/

      - name: Decrypt all DMGs
        run: |
          # 用 base64 解码生成解密脚本，零转义问题
          base64 -d <<< "" > decrypt.py
          ls -lh firmware/*.dmg 2>/dev/null || echo "未找到DMG"
          for DMG in firmware/*.dmg; do
            if [ -f "$DMG" ]; then
              BASENAME=$(basename "$DMG")
              echo "解密: $BASENAME"
              python3 decrypt.py "$DMG" "decrypted_$BASENAME" && echo "  成功" || echo "  失败"
            fi
          done
          ls -lh decrypted_*.dmg 2>/dev/null || echo "无解密文件"

      - name: Mount ALL decrypted DMGs
        run: |
          INDEX=1
          for DMG in decrypted_*.dmg; do
            if [ -f "$DMG" ] && [ -s "$DMG" ]; then
              BASENAME=$(basename "$DMG")
              MOUNTPOINT="/Volumes/dmg_$INDEX"
              echo "挂载 $INDEX: $BASENAME -> $MOUNTPOINT"
              if [ -d "$MOUNTPOINT" ]; then
                sudo hdiutil detach "$MOUNTPOINT" -force 2>/dev/null || true
                sleep 1
              fi
              sudo hdiutil attach "$DMG" -mountpoint "$MOUNTPOINT" -nobrowse -readonly 2>/dev/null
              if [ -d "$MOUNTPOINT" ] && [ "$(ls -A "$MOUNTPOINT" 2>/dev/null)" ]; then
                echo "  成功"
                INDEX=$((INDEX + 1))
              else
                echo "  失败"
              fi
            fi
          done
          ls -d /Volumes/dmg_* 2>/dev/null || echo "无挂载点"

      - name: Search Sandbox in all DMGs
        run: |
          echo "搜索 Sandbox 文件夹..."
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              echo "搜索卷: $VOL"
              sudo find "$VOL" -type d -name "Sandbox" 2>/dev/null | while read -r DIR; do
                echo "  找到: $DIR"
                cp -R "$DIR" extracted/sandbox/ 2>/dev/null || sudo cp -R "$DIR" extracted/sandbox/ 2>/dev/null
              done
            fi
          done
          echo "Sandbox 结果:"
          ls -lhR extracted/sandbox/ 2>/dev/null || echo "  未找到"

      - name: Search daemons and frameworks in all DMGs
        run: |
          echo "搜索 daemons 和 frameworks..."
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              echo "搜索卷: $VOL"
              for DAEMON in amfid installd sandboxd trustd; do
                sudo find "$VOL" -type f -name "$DAEMON" 2>/dev/null | while read -r FILE; do
                  echo "  找到 daemon: $FILE"
                  sudo cp "$FILE" extracted/daemons/ 2>/dev/null
                done
              done
              for FRAMEWORK in AppleMobileFileIntegrity Security; do
                sudo find "$VOL" -type d -name "${FRAMEWORK}.framework" 2>/dev/null | while read -r DIR; do
                  echo "  找到 framework: $DIR"
                  sudo cp -R "$DIR" extracted/frameworks/ 2>/dev/null
                done
              done
            fi
          done
          echo "提取结果:"
          echo "Daemons:" && ls -lh extracted/daemons/ 2>/dev/null || echo "  无"
          echo "Frameworks:" && ls -lh extracted/frameworks/ 2>/dev/null || echo "  无"

      - name: Extract kernelcache
        run: |
          echo "处理 kernelcache..."
          KERNELCACHE=$(find firmware -name "kernelcache.release*" -type f 2>/dev/null | head -1)
          if [ -n "$KERNELCACHE" ]; then
            echo "找到: $KERNELCACHE"
            cp "$KERNELCACHE" extracted/kernel/
            if file "$KERNELCACHE" | grep -q "img4"; then
              echo "解密 kernelcache..."
              python3 decrypt.py "$KERNELCACHE" extracted/kernel/kernelcache.decrypted && echo "解密成功" || echo "解密失败"
            fi
            if [ -f extracted/kernel/kernelcache.decrypted ]; then
              echo "解包..."
              ipsw kernel decache extracted/kernel/kernelcache.decrypted 2>/dev/null || echo "解包失败"
            fi
          else
            echo "未找到 kernelcache.release"
          fi
          echo "Kernel 结果:" && ls -lhR extracted/kernel/ 2>/dev/null || echo "  无"

      - name: Unmount all
        if: always()
        run: |
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              sudo hdiutil detach "$VOL" -force 2>/dev/null || true
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted_files
          path: extracted/
          retention-days: 7
