name: Decrypt and Extract iOS Firmware

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  decrypt:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: |
          brew tap blacktop/tap
          brew install ipsw
          pip3 install pyimg4 --break-system-packages 2>/dev/null || pip3 install pyimg4 --user

      - name: Create output directories
        run: |
          mkdir -p extracted/daemons
          mkdir -p extracted/frameworks
          mkdir -p extracted/kexts
          mkdir -p extracted/strings

      - name: Download firmware
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Extract IPSW
        run: |
          unzip -q firmware.ipsw -d firmware/
          echo "解压完成"

      - name: Get decryption keys
        run: |
          curl -s "https://api.ipsw.me/v2.1/firmwares/iPhone11,2/18.7.6/22H320" -o keys.json
          IV=$(cat keys.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('iv', ''))")
          KEY=$(cat keys.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('key', ''))")
          echo "IV=$IV" >> $GITHUB_ENV
          echo "KEY=$KEY" >> $GITHUB_ENV
          echo "IV=$IV, KEY=$KEY"

      - name: Decrypt and mount
        run: |
          SYSTEM_DMG=$(find firmware -name "*.dmg" | head -1)
          DECRYPTED="decrypted.dmg"
          
          if [ -n "$IV" ] && [ -n "$KEY" ]; then
            img4 -i "$SYSTEM_DMG" -o "$DECRYPTED" -k "$KEY" -iv "$IV" || true
          fi
          
          if [ -f "$DECRYPTED" ]; then
            sudo hdiutil attach "$DECRYPTED" -mountpoint /Volumes/System -nobrowse
          else
            sudo hdiutil attach "$SYSTEM_DMG" -mountpoint /Volumes/System -nobrowse
          fi
          
          ls -la /Volumes/System/

      - name: Extract daemons
        run: |
          for daemon in amfid installd sandboxd trustd; do
            find /Volumes/System -name "$daemon" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          done
          echo "守护进程:"
          ls -la extracted/daemons/

      - name: Extract frameworks
        run: |
          for framework in AppleMobileFileIntegrity Security; do
            find /Volumes/System -type d -name "${framework}.framework" -exec cp -R {} extracted/frameworks/ \; 2>/dev/null || true
          done
          echo "框架:"
          ls -la extracted/frameworks/

      - name: Extract kexts
        run: |
          for kext in sandbox AMFI; do
            find /Volumes/System -type d -name "${kext}.kext" -exec cp -R {} extracted/kexts/ \; 2>/dev/null || true
          done
          echo "内核扩展:"
          ls -la extracted/kexts/

      - name: Extract strings
        run: |
          for daemon in extracted/daemons/*; do
            if [ -f "$daemon" ]; then
              name=$(basename "$daemon")
              strings "$daemon" | grep -E "com.apple|XPC|entitlement|non.fatal|sdk|version|disabled" > "extracted/strings/${name}.txt" 2>/dev/null || true
              echo "$name: $(wc -l < extracted/strings/${name}.txt 2>/dev/null) 行"
            fi
          done

      - name: Unmount
        run: |
          sudo hdiutil detach /Volumes/System -force 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: extracted_files
          path: extracted/
          retention-days: 7
