name: amfid 完整深度逆向分析

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压框架
        run: unzip -q amfid.zip -d extracted_frameworks/ 2>/dev/null || true

      - name: 安装工具
        run: |
          brew install radare2 binutils lzfse capstone keystone
          curl -L -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip"
          unzip -q ghidra.zip -d /Applications/
          GHIDRA_HOME=$(find /Applications -name "ghidra_*" -type d -maxdepth 1 | head -1)
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> $GITHUB_ENV

      - name: 创建输出目录
        run: mkdir -p output/{1_static,2_signing,3_ipc,4_vuln,ghidra,reports}

      # ==================== 一、二进制静态分析 ====================
      - name: 一、Mach-O 结构分析
        run: |
          echo "=== 文件类型 ===" > output/1_static/info.txt
          file amfid >> output/1_static/info.txt
          echo "=== Mach-O 头 ===" > output/1_static/header.txt
          otool -hv amfid >> output/1_static/header.txt 2>&1
          echo "=== Fat Binary 信息 ===" > output/1_static/fat.txt
          otool -fv amfid >> output/1_static/fat.txt 2>&1
          echo "=== Load Commands ===" > output/1_static/load_commands.txt
          otool -l amfid >> output/1_static/load_commands.txt 2>&1
          echo "=== 段信息 ===" > output/1_static/segments.txt
          otool -l amfid | grep -A5 "LC_SEGMENT_64" | grep -E "(segname|vmaddr|vmsize|fileoff|filesize|maxprot|initprot)" >> output/1_static/segments.txt 2>&1
          echo "=== 动态库依赖 ===" > output/1_static/dylibs.txt
          otool -L amfid >> output/1_static/dylibs.txt 2>&1
          echo "=== 入口点 ===" > output/1_static/entry.txt
          r2 -q -c 'aaa; ie' amfid >> output/1_static/entry.txt 2>&1
          echo "=== 节信息 ===" > output/1_static/sections.txt
          r2 -q -c 'aaa; iS' amfid >> output/1_static/sections.txt 2>&1

      - name: 一、符号和字符串分析
        run: |
          echo "=== 所有符号 ===" > output/1_static/symbols_all.txt
          nm -C -a amfid >> output/1_static/symbols_all.txt 2>&1
          echo "=== 导出函数 ===" > output/1_static/exports.txt
          nm -gU amfid >> output/1_static/exports.txt 2>&1
          echo "=== 导入函数 ===" > output/1_static/imports_all.txt
          nm -u amfid >> output/1_static/imports_all.txt 2>&1
          echo "=== 按库分类的导入 ===" > output/1_static/imports_by_lib.txt
          nm -u amfid | awk '{print $2}' | sort | uniq -c | sort -rn >> output/1_static/imports_by_lib.txt 2>&1
          echo "=== 所有字符串 (>=4字符) ===" > output/1_static/strings_all.txt
          strings -n 4 amfid | sort -u >> output/1_static/strings_all.txt 2>&1
          echo "=== 硬编码路径 ===" > output/1_static/strings_paths.txt
          strings amfid | grep -E "^/" | sort -u >> output/1_static/strings_paths.txt 2>&1
          echo "=== URL/域名 ===" > output/1_static/strings_urls.txt
          strings amfid | grep -iE "https?://|\.apple\.com|\.icloud\.com" | sort -u >> output/1_static/strings_urls.txt 2>&1
          echo "=== 错误消息 ===" > output/1_static/strings_errors.txt
          strings amfid | grep -iE "error|fail|invalid|denied|reject|unknown|missing" | sort -u >> output/1_static/strings_errors.txt 2>&1

      - name: 一、函数列表和控制流
        run: |
          echo "=== 所有函数及地址 ===" > output/1_static/functions.txt
          r2 -q -c 'aaa; afl' amfid >> output/1_static/functions.txt 2>&1
          echo "=== 函数调用关系 ===" > output/1_static/callgraph.txt
          r2 -q -c 'aaa; agf' amfid >> output/1_static/callgraph.txt 2>&1
          echo "=== 导入函数交叉引用 ===" > output/1_static/import_xrefs.txt
          IMPORT_FUNCS=$(nm -u amfid | awk '{print $3}' | head -50)
          if [ -n "$IMPORT_FUNCS" ]; then
            for FUNC in $IMPORT_FUNCS; do
              echo "=== $FUNC ===" >> output/1_static/import_xrefs.txt
              r2 -q -c "aaa; /a $FUNC" amfid >> output/1_static/import_xrefs.txt 2>&1 || true
            done
          fi

      # ==================== 二、签名验证链分析 ====================
      - name: 二、CMS/PKCS7 签名解析
        run: |
          echo "=== CMS 相关字符串 ===" > output/2_signing/cms_strings.txt
          strings amfid | grep -iE "CMS|PKCS7|pkcs|DER|ASN1|asn1|ber|CER|certificate|x509|X509" | sort -u >> output/2_signing/cms_strings.txt || true
          echo "=== CMS 相关函数 ===" > output/2_signing/cms_functions.txt
          nm amfid 2>/dev/null | grep -iE "cms|pkcs|der|asn|ber|cer|x509|cert" >> output/2_signing/cms_functions.txt || true
          nm -u amfid | grep -iE "CMS|PKCS|DER|ASN|CER|X509|cert" >> output/2_signing/cms_functions.txt || true
          echo "=== CMS 相关导入 ===" > output/2_signing/cms_imports.txt
          nm -u amfid | grep -iE "CMS|PKCS|DER|ASN|CER" >> output/2_signing/cms_imports.txt || true
          CMS_FUNCS=$(nm amfid 2>/dev/null | grep -iE "cms|pkcs|der|asn" | awk '{print $3}' | head -20)
          if [ -n "$CMS_FUNCS" ]; then
            for FUNC in $CMS_FUNCS; do
              echo "=== $FUNC ===" >> output/2_signing/cms_disasm.txt
              r2 -q -c "aaa; s sym.$FUNC; pdf" amfid >> output/2_signing/cms_disasm.txt 2>&1 || true
            done
          fi

      - name: 二、CDHash 和哈希验证
        run: |
          echo "=== CDHash 相关字符串 ===" > output/2_signing/cdhash_strings.txt
          strings amfid | grep -iE "cdhash|CDHash|cd_hash|hash|sha|SHA|md5|MD5" | sort -u >> output/2_signing/cdhash_strings.txt || true
          echo "=== CDHash 相关函数 ===" > output/2_signing/cdhash_functions.txt
          nm amfid 2>/dev/null | grep -iE "cdhash|hash|sha|md5|digest" >> output/2_signing/cdhash_functions.txt || true
          nm -u amfid | grep -iE "CC_SHA|CC_MD5|CCDigest|cdhash" >> output/2_signing/cdhash_functions.txt || true
          CDHASH_FUNCS=$(nm amfid 2>/dev/null | grep -iE "cdhash|hash|sha|md5|digest" | awk '{print $3}' | head -20)
          if [ -n "$CDHASH_FUNCS" ]; then
            for FUNC in $CDHASH_FUNCS; do
              echo "=== $FUNC ===" >> output/2_signing/cdhash_disasm.txt
              r2 -q -c "aaa; s sym.$FUNC; pdf" amfid >> output/2_signing/cdhash_disasm.txt 2>&1 || true
            done
          fi

      - name: 二、IMG4/IM4P 验证
        run: |
          echo "=== IMG4 相关字符串 ===" > output/2_signing/img4_strings.txt
          strings amfid | grep -iE "IMG4|IM4P|im4p|im4m|im4r|Image4|AppleImage4" | sort -u >> output/2_signing/img4_strings.txt || true
          echo "=== IMG4 相关函数 ===" > output/2_signing/img4_functions.txt
          nm amfid 2>/dev/null | grep -iE "img4|im4p|im4m|im4r|image4" >> output/2_signing/img4_functions.txt || true
          nm -u amfid | grep -iE "IMG4|Image4|img4" >> output/2_signing/img4_functions.txt || true
          IMG4_FUNCS=$(nm amfid 2>/dev/null | grep -iE "img4|im4p|image4" | awk '{print $3}' | head -20)
          if [ -n "$IMG4_FUNCS" ]; then
            for FUNC in $IMG4_FUNCS; do
              echo "=== $FUNC ===" >> output/2_signing/img4_disasm.txt
              r2 -q -c "aaa; s sym.$FUNC; pdf" amfid >> output/2_signing/img4_disasm.txt 2>&1 || true
            done
          fi

      - name: 二、Entitlement 和 Provision 验证
        run: |
          echo "=== Entitlement 相关字符串 ===" > output/2_signing/entitlement_strings.txt
          strings amfid | grep -iE "entitlement|Entitlement|entitle|provision|Provision|provisioning|Provisioning|embedded.mobileprovision" | sort -u >> output/2_signing/entitlement_strings.txt || true
          echo "=== Entitlement 相关函数 ===" > output/2_signing/entitlement_functions.txt
          nm amfid 2>/dev/null | grep -iE "entitle|provision" >> output/2_signing/entitlement_functions.txt || true
          nm -u amfid | grep -iE "entitle|provision|SecTask|SecCode" >> output/2_signing/entitlement_functions.txt || true
          ENT_FUNCS=$(nm amfid 2>/dev/null | grep -iE "entitle|provision" | awk '{print $3}' | head -20)
          if [ -n "$ENT_FUNCS" ]; then
            for FUNC in $ENT_FUNCS; do
              echo "=== $FUNC ===" >> output/2_signing/entitlement_disasm.txt
              r2 -q -c "aaa; s sym.$FUNC; pdf" amfid >> output/2_signing/entitlement_disasm.txt 2>&1 || true
            done
          fi

      - name: 二、TeamID 验证
        run: |
          echo "=== TeamID 相关字符串 ===" > output/2_signing/teamid_strings.txt
          strings amfid | grep -iE "TeamID|teamid|team_id|TeamIdentifier|OU=" | sort -u >> output/2_signing/teamid_strings.txt || true
          echo "=== SecCode/SecTrust API ===" > output/2_signing/seccode_api.txt
          nm -u amfid | grep -iE "SecCode|SecTrust|SecRequirement|SecStaticCode|SecTask|SecPolicy|SecCertificate" >> output/2_signing/seccode_api.txt || true

      - name: 二、OID 分析
        run: |
          echo "=== Apple OID 字符串 ===" > output/2_signing/oid_strings.txt
          strings amfid | grep -E "1\.2\.840\.113635|1\.2\.840\.113549|1\.3\.6\.1" | sort -u >> output/2_signing/oid_strings.txt || true
          echo "=== OID 相关函数 ===" > output/2_signing/oid_functions.txt
          nm -u amfid | grep -iE "OID|SecCertificate|SecPolicy|SecTrust" >> output/2_signing/oid_functions.txt || true
          r2 -q -c 'aaa; /a 1.2.840.113635' amfid >> output/2_signing/oid_xrefs.txt 2>&1 || true
          r2 -q -c 'aaa; /a SecCertificate' amfid >> output/2_signing/oid_xrefs.txt 2>&1 || true

      - name: 二、CS Flags 和跳过验证条件
        run: |
          echo "=== CS Flags ===" > output/2_signing/cs_flags.txt
          strings amfid | grep -iE "CS_HARD|CS_KILL|CS_VALID|CS_DEBUGGED|CS_INSTALLER|CS_GET_TASK_ALLOW|CS_RESTRICT|CS_REQUIRE_LV|CS_PLATFORM_BINARY|CS_ADHOC" | sort -u >> output/2_signing/cs_flags.txt || true
          echo "=== 跳过/绕过关键字 ===" > output/2_signing/bypass_strings.txt
          strings amfid | grep -iE "skip|bypass|ignore|override|force|disable|allow_all|trust_all|trusted|whitelist|always_allow" | sort -u >> output/2_signing/bypass_strings.txt || true
          echo "=== 豁免 Entitlement ===" > output/2_signing/exempt_entitlements.txt
          strings amfid | grep -iE "skip-code|bypass|get-task-allow|task_for_pid-allow|platform-application|private\.amfi" | sort -u >> output/2_signing/exempt_entitlements.txt || true
          echo "=== TrustCache 相关 ===" > output/2_signing/trustcache_bypass.txt
          strings amfid | grep -iE "trustcache|TrustCache|trust_cache|cached|previously_verified|already_validated|known_hash" | sort -u >> output/2_signing/trustcache_bypass.txt || true
          echo "=== CS_OPS ===" > output/2_signing/csops.txt
          strings amfid | grep -iE "csops|CS_OPS|cs_ops" | sort -u >> output/2_signing/csops.txt || true
          nm -u amfid | grep -iE "csops" >> output/2_signing/csops.txt || true

      # ==================== 三、进程间通信分析 ====================
      - name: 三、Mach 消息分析
        run: |
          echo "=== Mach 相关字符串 ===" > output/3_ipc/mach_strings.txt
          strings amfid | grep -iE "mach_msg|mach_port|mach_host|task_for_pid|host_get|bootstrap|mach_task|mach_vm" | sort -u >> output/3_ipc/mach_strings.txt || true
          echo "=== Mach 相关函数 ===" > output/3_ipc/mach_functions.txt
          nm amfid 2>/dev/null | grep -iE "mach_msg|mach_port|mach_" >> output/3_ipc/mach_functions.txt || true
          nm -u amfid | grep -iE "mach_msg|mach_port|mach_host|task_for_pid|bootstrap" >> output/3_ipc/mach_functions.txt || true
          MACH_FUNCS=$(nm amfid 2>/dev/null | grep -iE "mach_msg|mach_port" | awk '{print $3}' | head -20)
          if [ -n "$MACH_FUNCS" ]; then
            for FUNC in $MACH_FUNCS; do
              echo "=== $FUNC ===" >> output/3_ipc/mach_disasm.txt
              r2 -q -c "aaa; s sym.$FUNC; pdf" amfid >> output/3_ipc/mach_disasm.txt 2>&1 || true
            done
          fi

      - name: 三、XPC 服务分析
        run: |
          echo "=== XPC 相关字符串 ===" > output/3_ipc/xpc_strings.txt
          strings amfid | grep -iE "xpc_connection|xpc_dictionary|xpc_pipe|xpc_|XPC|com\.apple" | sort -u >> output/3_ipc/xpc_strings.txt || true
          echo "=== XPC 相关函数 ===" > output/3_ipc/xpc_functions.txt
          nm -u amfid | grep -iE "xpc_" >> output/3_ipc/xpc_functions.txt || true
          echo "=== XPC 服务名 ===" > output/3_ipc/xpc_services.txt
          strings amfid | grep -E "com\.apple\.[a-z]+\.[a-z]+" | sort -u >> output/3_ipc/xpc_services.txt || true
          XPC_FUNCS=$(nm -u amfid | grep -iE "xpc_connection_create|xpc_connection_send|xpc_dictionary_create" | awk '{print $3}' | head -10)
          if [ -n "$XPC_FUNCS" ]; then
            for FUNC in $XPC_FUNCS; do
              echo "=== XPC 交叉引用: $FUNC ===" >> output/3_ipc/xpc_xrefs.txt
              r2 -q -c "aaa; /a $FUNC" amfid >> output/3_ipc/xpc_xrefs.txt 2>&1 || true
            done
          fi

      - name: 三、通信接口汇总
        run: |
          echo "=== 所有 IPC 相关字符串 ===" > output/3_ipc/ipc_all.txt
          strings amfid | grep -iE "mach|XPC|xpc|port|bootstrap|service|connection|message|send|receive|handler|callback|delegate" | sort -u >> output/3_ipc/ipc_all.txt || true
          echo "=== 通知/信号 ===" > output/3_ipc/notifications.txt
          strings amfid | grep -iE "notify|notification|signal|CFNotification|DarwinNotify|dispatch_source" | sort -u >> output/3_ipc/notifications.txt || true
          echo "=== 共享内存 ===" > output/3_ipc/shared_memory.txt
          strings amfid | grep -iE "shared|mmap|shm|vm_allocate|vm_map|memory" | sort -u >> output/3_ipc/shared_memory.txt || true

      # ==================== 四、漏洞挖掘 ====================
      - name: 四、缓冲区溢出风险
        run: |
          echo "=== 危险函数 ===" > output/4_vuln/dangerous_functions.txt
          nm -u amfid | grep -iE "strcpy|strcat|sprintf|gets|scanf|memcpy|memmove|bcopy|read|recv|fscanf|sscanf" >> output/4_vuln/dangerous_functions.txt || true
          echo "=== 内存操作函数 ===" > output/4_vuln/memory_functions.txt
          nm -u amfid | grep -iE "malloc|calloc|realloc|free|mmap|vm_allocate|vm_deallocate|mach_vm" >> output/4_vuln/memory_functions.txt || true
          echo "=== 内存操作交叉引用 ===" > output/4_vuln/memory_xrefs.txt
          for FUNC in malloc free calloc realloc memcpy memmove strcpy; do
            echo "=== $FUNC ===" >> output/4_vuln/memory_xrefs.txt
            r2 -q -c "aaa; /a $FUNC" amfid >> output/4_vuln/memory_xrefs.txt 2>&1 || true
          done

      - name: 四、整数溢出和格式化字符串
        run: |
          echo "=== 整数操作 ===" > output/4_vuln/integer_ops.txt
          nm amfid 2>/dev/null | grep -iE "size|length|count|offset|index|len" >> output/4_vuln/integer_ops.txt || true
          echo "=== 格式化函数 ===" > output/4_vuln/format_functions.txt
          nm -u amfid | grep -iE "printf|fprintf|snprintf|asprintf|syslog|os_log|NSLog" >> output/4_vuln/format_functions.txt || true
          FORMAT_FUNCS=$(nm -u amfid | grep -iE "printf|fprintf|snprintf|syslog|os_log|NSLog" | awk '{print $3}' | head -10)
          if [ -n "$FORMAT_FUNCS" ]; then
            for FUNC in $FORMAT_FUNCS; do
              echo "=== $FUNC 交叉引用 ===" >> output/4_vuln/format_xrefs.txt
              r2 -q -c "aaa; /a $FUNC" amfid >> output/4_vuln/format_xrefs.txt 2>&1 || true
            done
          fi

      - name: 四、路径遍历和符号链接
        run: |
          echo "=== 文件操作 ===" > output/4_vuln/file_operations.txt
          nm -u amfid | grep -iE "open|read|write|close|stat|lstat|fstat|access|realpath|readlink|symlink|chdir|chmod|chown|unlink|rename|mkdir|rmdir|fopen|fread|fwrite|fclose" >> output/4_vuln/file_operations.txt || true
          echo "=== 路径字符串 ===" > output/4_vuln/path_strings.txt
          strings amfid | grep -E "^/" | sort -u >> output/4_vuln/path_strings.txt || true
          echo "=== 文件操作交叉引用 ===" > output/4_vuln/file_xrefs.txt
          for FUNC in open read write stat access realpath symlink; do
            echo "=== $FUNC ===" >> output/4_vuln/file_xrefs.txt
            r2 -q -c "aaa; /a $FUNC" amfid >> output/4_vuln/file_xrefs.txt 2>&1 || true
          done

      - name: 四、权限提升和代码执行
        run: |
          echo "=== 权限相关 ===" > output/4_vuln/privilege.txt
          strings amfid | grep -iE "setuid|setgid|seteuid|setegid|getuid|geteuid|getgid|getegid|root|wheel|admin|entitle|allow|deny|permit|grant" | sort -u >> output/4_vuln/privilege.txt || true
          echo "=== 代码执行 ===" > output/4_vuln/code_exec.txt
          strings amfid | grep -iE "exec|spawn|fork|vfork|posix_spawn|system|popen|dlopen|dlsym|NSTask|NSBundle" | sort -u >> output/4_vuln/code_exec.txt || true

      - name: 四、错误处理和逻辑漏洞
        run: |
          echo "=== 错误处理 ===" > output/4_vuln/error_handling.txt
          strings amfid | grep -iE "error|fail|invalid|deny|denied|reject|rejected|unknown|unexpected|missing|timeout|retry" | sort -u >> output/4_vuln/error_handling.txt || true
          echo "=== 返回码分析 ===" > output/4_vuln/return_codes.txt
          strings amfid | grep -E "^[0-9]+$" | sort -u >> output/4_vuln/return_codes.txt || true
          echo "=== 验证逻辑关键字 ===" > output/4_vuln/verify_logic.txt
          strings amfid | grep -iE "verify|validate|check|compare|match|authorize|authenticate|allow|deny|pass|fail|success|true|false|yes|no|ok" | sort -u >> output/4_vuln/verify_logic.txt || true

      # ==================== Ghidra 分析 ====================
      - name: Ghidra 深度反编译
        if: env.GHIDRA_HOME != ''
        run: |
          if [ -f amfid ] && [ -n "$GHIDRA_HOME" ]; then
            GHIDRA_HEADLESS="$GHIDRA_HOME/support/analyzeHeadless"
            if [ -f "$GHIDRA_HEADLESS" ]; then
              PROJECT_DIR="output/ghidra/amfid_project"
              mkdir -p "$PROJECT_DIR"
              "$GHIDRA_HEADLESS" "$PROJECT_DIR" "amfid" -import amfid -postScript "AutoAnalysis.java" -analysisTimeoutPerFile 600 2>&1 || true
            fi
          fi

      # ==================== 报告 ====================
      - name: 生成完整报告
        run: |
          echo "# amfid 完整逆向分析报告" > output/reports/AMFID_FULL_REPORT.md
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "## 一、二进制静态分析" >> output/reports/AMFID_FULL_REPORT.md
          echo "### 文件信息" >> output/reports/AMFID_FULL_REPORT.md
          cat output/1_static/info.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "### 依赖库" >> output/reports/AMFID_FULL_REPORT.md
          cat output/1_static/dylibs.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "## 二、签名验证链" >> output/reports/AMFID_FULL_REPORT.md
          echo "### CMS 相关导入" >> output/reports/AMFID_FULL_REPORT.md
          cat output/2_signing/cms_imports.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "### CDHash 相关" >> output/reports/AMFID_FULL_REPORT.md
          cat output/2_signing/cdhash_functions.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "### OID" >> output/reports/AMFID_FULL_REPORT.md
          cat output/2_signing/oid_strings.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "### CS Flags" >> output/reports/AMFID_FULL_REPORT.md
          cat output/2_signing/cs_flags.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "### 跳过验证条件" >> output/reports/AMFID_FULL_REPORT.md
          cat output/2_signing/bypass_strings.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "## 三、进程间通信" >> output/reports/AMFID_FULL_REPORT.md
          echo "### XPC 服务" >> output/reports/AMFID_FULL_REPORT.md
          cat output/3_ipc/xpc_services.txt >> output/reports/AMFID_FULL_REPORT.md 2>/dev/null || true
          echo "" >> output/reports/AMFID_FULL_REPORT.md
          echo "## 四、漏洞挖掘" >> output/reports/AMFID_FULL_REPORT.md
