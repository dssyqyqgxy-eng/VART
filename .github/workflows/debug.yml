name: 提取 /private/var/db 完整内容

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装工具
        run: |
          brew tap blacktop/tap && brew install ipsw

      - name: 创建输出目录
        run: mkdir -p output

      - name: 下载 IPSW
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"

      - name: 提取 /private/var/db 全部内容
        run: |
          echo "=== 提取 /private/var/db ==="
          ipsw extract --files --pattern 'private/var/db/' -o output/var_db firmware.ipsw 2>&1 || true
          
          echo "=== 提取结果 ==="
          find output/var_db -type f 2>/dev/null | head -100

      - name: 打包为 zip
        run: |
          if [ -d output/var_db ] && [ "$(ls -A output/var_db 2>/dev/null)" ]; then
            cd output/var_db
            zip -r ../../var_db.zip . || true
            cd ../..
            echo "=== 打包完成 ==="
            ls -lh var_db.zip
          else
            echo "未提取到文件"
          fi

      - name: 上传 zip
        uses: actions/upload-artifact@v4
        with:
          name: var_db_full
          path: var_db.zip
          retention-days: 90
