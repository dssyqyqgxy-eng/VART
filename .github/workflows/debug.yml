name: Decrypt and Extract iOS Firmware

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: |
          brew tap blacktop/tap
          brew install ipsw
          pip3 install pyimg4 --break-system-packages

      - name: Create output directories
        run: |
          mkdir -p extracted/daemons
          mkdir -p extracted/frameworks
          mkdir -p extracted/kexts
          mkdir -p extracted/strings

      - name: Download firmware
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Extract IPSW
        run: |
          unzip -q firmware.ipsw -d firmware/

      - name: Decrypt all DMGs
        run: |
          for DMG in firmware/*.dmg; do
            echo "解密: $(basename "$DMG")"
            img4 -i "$DMG" -o "decrypted_$(basename "$DMG")" 2>/dev/null || true
          done

      - name: Mount original DMGs
        run: |
          INDEX=1
          for DMG in firmware/*.dmg; do
            sudo hdiutil attach "$DMG" -mountpoint "/Volumes/orig_$INDEX" -nobrowse -readonly 2>/dev/null || true
            INDEX=$((INDEX + 1))
          done

      - name: Mount decrypted DMGs
        run: |
          INDEX=1
          for DMG in decrypted_*.dmg; do
            if [ -f "$DMG" ]; then
              sudo hdiutil attach "$DMG" -mountpoint "/Volumes/dec_$INDEX" -nobrowse -readonly 2>/dev/null || true
            fi
            INDEX=$((INDEX + 1))
          done

      - name: Search ALL mounted volumes
        run: |
          for VOL in /Volumes/*; do
            if [ -d "$VOL" ]; then
              echo "搜索: $VOL"
              sudo find "$VOL" -name "amfid" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
              sudo find "$VOL" -name "installd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
              sudo find "$VOL" -name "sandboxd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
              sudo find "$VOL" -name "trustd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
              sudo find "$VOL" -type d -name "AppleMobileFileIntegrity.framework" -exec cp -R {} extracted/frameworks/ \; 2>/dev/null || true
              sudo find "$VOL" -type d -name "Security.framework" -exec cp -R {} extracted/frameworks/ \; 2>/dev/null || true
              sudo find "$VOL" -type d -name "sandbox.kext" -exec cp -R {} extracted/kexts/ \; 2>/dev/null || true
              sudo find "$VOL" -type d -name "AMFI.kext" -exec cp -R {} extracted/kexts/ \; 2>/dev/null || true
            fi
          done

      - name: Search firmware directory
        run: |
          find firmware -name "amfid" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          find firmware -name "installd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          find firmware -name "sandboxd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          find firmware -name "trustd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          find firmware -type d -name "AppleMobileFileIntegrity.framework" -exec cp -R {} extracted/frameworks/ \; 2>/dev/null || true
          find firmware -type d -name "Security.framework" -exec cp -R {} extracted/frameworks/ \; 2>/dev/null || true

      - name: Search entire root filesystem
        run: |
          sudo find / -name "amfid" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          sudo find / -name "installd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          sudo find / -name "sandboxd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true
          sudo find / -name "trustd" -type f -exec cp {} extracted/daemons/ \; 2>/dev/null || true

      - name: Unmount all
        run: |
          for VOL in /Volumes/orig_* /Volumes/dec_*; do
            sudo hdiutil detach "$VOL" -force 2>/dev/null || true
          done

      - name: Extract strings
        run: |
          for daemon in extracted/daemons/*; do
            if [ -f "$daemon" ]; then
              name=$(basename "$daemon")
              strings "$daemon" > "extracted/strings/${name}.txt"
            fi
          done
          strings firmware.ipsw > extracted/strings/ipsw.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: extracted_files
          path: extracted/
          retention-days: 7
