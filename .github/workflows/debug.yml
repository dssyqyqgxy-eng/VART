name: Extract Binaries, Frameworks, Sandbox and Kernel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install ipsw
        run: |
          brew tap blacktop/tap
          brew install ipsw
          ipsw version

      - name: Download firmware
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Extract required files from IPSW
        run: |
          mkdir -p extracted/daemons extracted/frameworks extracted/sandbox extracted/kernel

          # 1. 提取内核（已自动解密）
          echo "提取 kernelcache..."
          ipsw extract --kernel -o extracted/kernel firmware.ipsw

          # 2. 提取守护进程二进制（匹配路径末尾为 amfid, installd, sandboxd, trustd）
          echo "提取 daemons..."
          ipsw extract --files --pattern '(?i)(amfid|installd|sandboxd|trustd)$' \
            --flat -o extracted/daemons firmware.ipsw

          # 3. 提取整个框架目录（保留目录结构）
          echo "提取 AppleMobileFileIntegrity.framework..."
          ipsw extract --files --pattern 'AppleMobileFileIntegrity\.framework/' \
            -o extracted/frameworks firmware.ipsw

          echo "提取 Security.framework..."
          ipsw extract --files --pattern 'Security\.framework/' \
            -o extracted/frameworks firmware.ipsw

          # 4. 提取 Sandbox 文件夹（保留目录结构）
          echo "提取 Sandbox 文件夹..."
          ipsw extract --files --pattern 'Sandbox/' \
            -o extracted/sandbox firmware.ipsw

          # 显示提取结果
          echo ""
          echo "==== 提取结果 ===="
          echo "--- Daemons ---"
          ls -lh extracted/daemons/ 2>/dev/null || echo "  无文件"
          echo "--- Frameworks ---"
          find extracted/frameworks -maxdepth 3 -type d 2>/dev/null || echo "  无文件"
          echo "--- Sandbox ---"
          find extracted/sandbox -maxdepth 3 -type d 2>/dev/null || echo "  无文件"
          echo "--- Kernel ---"
          ls -lh extracted/kernel/ 2>/dev/null || echo "  无文件"

      - name: Process kernelcache (decompress if needed)
        run: |
          # 如果 kernelcache 是压缩的，用 ipsw kernel dec 解压
          KERNEL_FILE=$(find extracted/kernel -name "kernelcache*" -type f 2>/dev/null | head -1)
          if [ -n "$KERNEL_FILE" ]; then
            echo "检查 kernelcache: $KERNEL_FILE"
            file "$KERNEL_FILE"
            # 尝试解压（如果是 lzfse 等压缩）
            ipsw kernel dec "$KERNEL_FILE" -o extracted/kernel/kernelcache.decompressed 2>/dev/null || true
            if [ -f extracted/kernel/kernelcache.decompressed ]; then
              mv extracted/kernel/kernelcache.decompressed "$KERNEL_FILE"
              echo "kernelcache 已解压"
            else
              echo "kernelcache 无需解压或解压失败"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted_files
          path: extracted/
          retention-days: 7
