name: Decrypt, Mount All DMGs and Extract

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install tools
        run: |
          brew tap blacktop/tap
          brew install ipsw
          pip3 install pyimg4 --break-system-packages
          ipsw version

      - name: Create output directories
        run: mkdir -p extracted/daemons extracted/frameworks extracted/sandbox extracted/kernel

      - name: Download firmware
        run: |
          curl -L -o firmware.ipsw "https://updates.cdn-apple.com/2026WinterFCS/fullrestores/047-83292/FC308431-84C0-4001-9A24-09FC77486C76/iPhone11,2,iPhone11,4,iPhone11,6_18.7.6_22H320_Restore.ipsw"
          ls -lh firmware.ipsw

      - name: Extract IPSW
        run: |
          unzip -q firmware.ipsw -d firmware/
          ls -lh firmware/

      - name: Process AEA files (encrypted DMGs)
        run: |
          echo "解包 AEA 文件..."
          for AEA in firmware/*.dmg.aea; do
            if [ -f "$AEA" ]; then
              BASENAME=$(basename "$AEA" .aea)
              echo "处理: $BASENAME"
              ipsw aea extract "$AEA" -o "firmware/${BASENAME}.decrypted.dmg" 2>&1 || echo "  失败"
            fi
          done
          # 移动解密的 DMG 到 firmware 目录，以便后续统一处理
          ls -lh firmware/*.decrypted.dmg 2>/dev/null || echo "没有生成解密的 DMG"

      - name: Decrypt DMGs (IMG4)
        run: |
          echo "解密 IMG4 格式的 DMG..."
          # 收集所有需要解密的文件（原始 .dmg 和 .aea 解出的 .decrypted.dmg）
          DMG_LIST=$(ls firmware/*.dmg firmware/*.decrypted.dmg 2>/dev/null | grep -v ".dmg.aea")
          for DMG in $DMG_LIST; do
            if [ -f "$DMG" ]; then
              BASENAME=$(basename "$DMG")
              echo "解密: $BASENAME"
              ipsw img4 extract -i "$DMG" -o "decrypted_${BASENAME}" 2>&1
              if [ -f "decrypted_${BASENAME}" ] && [ -s "decrypted_${BASENAME}" ]; then
                echo "  成功"
              else
                echo "  失败"
              fi
            fi
          done
          ls -lh decrypted_*.dmg 2>/dev/null || echo "无解密文件"

      - name: Mount ALL decrypted DMGs
        run: |
          INDEX=1
          for DMG in decrypted_*.dmg; do
            if [ -f "$DMG" ] && [ -s "$DMG" ]; then
              BASENAME=$(basename "$DMG")
              MOUNTPOINT="/Volumes/dmg_$INDEX"
              echo "挂载 $INDEX: $BASENAME -> $MOUNTPOINT"
              if [ -d "$MOUNTPOINT" ]; then
                sudo hdiutil detach "$MOUNTPOINT" -force 2>/dev/null || true
                sleep 1
              fi
              sudo hdiutil attach "$DMG" -mountpoint "$MOUNTPOINT" -nobrowse -readonly 2>&1
              if [ -d "$MOUNTPOINT" ] && [ "$(ls -A "$MOUNTPOINT" 2>/dev/null)" ]; then
                echo "  成功"
                INDEX=$((INDEX + 1))
              else
                echo "  失败，尝试自动挂载..."
                AUTO_OUT=$(sudo hdiutil attach "$DMG" -nobrowse -readonly 2>&1)
                AUTO_MOUNT=$(echo "$AUTO_OUT" | grep -o '/Volumes/[^ ]*' | head -1)
                if [ -n "$AUTO_MOUNT" ]; then
                  ln -sf "$AUTO_MOUNT" "$MOUNTPOINT" && echo "  自动挂载 -> $AUTO_MOUNT"
                  INDEX=$((INDEX + 1))
                else
                  echo "  完全失败"
                fi
              fi
            fi
          done
          ls -d /Volumes/dmg_* 2>/dev/null || echo "无挂载点"

      - name: Search Sandbox in all DMGs
        run: |
          echo "搜索 Sandbox 文件夹..."
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              echo "搜索: $VOL"
              sudo find -L "$VOL" -type d -name "Sandbox" 2>/dev/null | while read -r DIR; do
                echo "  找到: $DIR"
                cp -R "$DIR" extracted/sandbox/ 2>/dev/null || sudo cp -R "$DIR" extracted/sandbox/ 2>/dev/null
              done
            fi
          done
          ls -lhR extracted/sandbox/ 2>/dev/null || echo "未找到 Sandbox"

      - name: Search daemons and frameworks in all DMGs
        run: |
          echo "搜索 daemons 和 frameworks..."
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              echo "搜索卷: $VOL"
              for DAEMON in amfid installd sandboxd trustd; do
                sudo find -L "$VOL" -type f -name "$DAEMON" 2>/dev/null | while read -r FILE; do
                  echo "  daemon: $FILE"
                  sudo cp "$FILE" extracted/daemons/ 2>/dev/null
                done
              done
              for FW in AppleMobileFileIntegrity Security; do
                sudo find -L "$VOL" -type d -name "${FW}.framework" 2>/dev/null | while read -r DIR; do
                  echo "  framework: $DIR"
                  sudo cp -R "$DIR" extracted/frameworks/ 2>/dev/null
                done
              done
            fi
          done
          echo "Daemons:" && ls extracted/daemons/ 2>/dev/null || echo "  无"
          echo "Frameworks:" && ls extracted/frameworks/ 2>/dev/null || echo "  无"

      - name: Extract kernelcache
        run: |
          KERNEL=$(find firmware -name "kernelcache.release*" -type f 2>/dev/null | head -1)
          if [ -n "$KERNEL" ]; then
            echo "处理: $KERNEL"
            cp "$KERNEL" extracted/kernel/
            ipsw img4 extract -i "$KERNEL" -o extracted/kernel/kernelcache.decrypted 2>&1
            if [ -f extracted/kernel/kernelcache.decrypted ] && [ -s extracted/kernel/kernelcache.decrypted ]; then
              echo "解密成功，解包..."
              ipsw kernel decache extracted/kernel/kernelcache.decrypted 2>&1 || echo "解包失败"
            else
              echo "解密失败或无需解密"
            fi
          else
            echo "未找到 kernelcache"
          fi
          ls -lhR extracted/kernel/ 2>/dev/null

      - name: Unmount all
        if: always()
        run: |
          for VOL in /Volumes/dmg_*; do
            if [ -d "$VOL" ]; then
              sudo hdiutil detach "$VOL" -force 2>/dev/null || true
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted_files
          path: extracted/
          retention-days: 7
