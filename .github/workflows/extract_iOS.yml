name: Extract iOS Firmware Components

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备型号 (例如: iPhone11,2)'
        required: true
        default: 'iPhone11,2'
        type: string
      version:
        description: 'iOS 版本 (例如: 18.7.6)'
        required: true
        default: '18.7.6'
        type: string
      components:
        description: '要提取的组件 (all/daemons/frameworks/dyld)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - daemons
          - frameworks
          - dyld

jobs:
  extract:
    name: Extract iOS Components
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: 创建输出目录
      - name: Create output directory
        run: |
          mkdir -p output/{daemons,frameworks,dyld_cache}
          echo "输出目录创建完成"
      
      # Step 2: 安装 ipsw 工具
      - name: Install ipsw
        run: |
          echo "安装 ipsw 工具..."
          wget -q https://github.com/blacktop/ipsw/releases/download/v3.1.628/ipsw_3.1.628_linux_amd64.deb
          sudo dpkg -i ipsw_*.deb 2>/dev/null || true
          rm ipsw_*.deb
          ipsw version || echo "ipsw 安装完成"
      
      # Step 3: 显示可用固件（调试用）
      - name: List available firmwares
        run: |
          echo "设备: ${{ inputs.device }}"
          echo "查询可用固件..."
          ipsw download --list --device ${{ inputs.device }} | head -20 || echo "无法获取固件列表"
      
      # Step 4: 提取 dyld 缓存
      - name: Extract dyld cache
        if: inputs.components == 'all' || inputs.components == 'dyld'
        run: |
          echo "提取 dyld 缓存..."
          echo "固件: ${{ inputs.device }}_${{ inputs.version }}_Restore.ipsw"
          
          ipsw extract --dyld --remote ${{ inputs.device }}_${{ inputs.version }}_Restore.ipsw -o output/dyld_cache/ 2>&1
          
          # 查找 dyld 缓存文件
          DYLD_FILE=$(find output/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          if [ -n "$DYLD_FILE" ]; then
            echo "DYLD_CACHE_FILE=$DYLD_FILE" >> $GITHUB_ENV
            echo "dyld_cache_size=$(du -h "$DYLD_FILE" | cut -f1)" >> $GITHUB_OUTPUT
            echo "✅ dyld 缓存提取成功: $(basename $DYLD_FILE)"
          else
            echo "⚠️ 未找到 dyld 缓存文件"
          fi
        continue-on-error: true
      
      # Step 5: 提取守护进程
      - name: Extract daemons
        if: inputs.components == 'all' || inputs.components == 'daemons'
        run: |
          echo "提取守护进程..."
          
          DYLD_CACHE=$(find output/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD_CACHE" ]; then
            echo "⚠️ 未找到 dyld 缓存，尝试直接提取..."
            # 直接从固件提取（备用方案）
            ipsw extract --dyld --remote ${{ inputs.device }}_${{ inputs.version }}_Restore.ipsw -o output/temp/
            DYLD_CACHE=$(find output/temp -name "dyld_shared_cache*" -type f | head -1)
          fi
          
          if [ -n "$DYLD_CACHE" ] && [ -f "$DYLD_CACHE" ]; then
            for daemon in amfid installd sandboxd trustd; do
              echo "  提取 $daemon..."
              ipsw dyld extract "$DYLD_CACHE" --extract "$daemon" --output output/daemons/ 2>/dev/null || echo "    ⚠️ $daemon 提取失败"
            done
            echo "✅ 守护进程提取完成"
          else
            echo "❌ 无法找到 dyld 缓存"
          fi
        continue-on-error: true
      
      # Step 6: 提取框架
      - name: Extract frameworks
        if: inputs.components == 'all' || inputs.components == 'frameworks'
        run: |
          echo "提取框架..."
          
          DYLD_CACHE=$(find output/dyld_cache -name "dyld_shared_cache*" -type f | head -1)
          
          if [ -z "$DYLD_CACHE" ]; then
            DYLD_CACHE=$(find output/temp -name "dyld_shared_cache*" -type f | head -1)
          fi
          
          if [ -n "$DYLD_CACHE" ] && [ -f "$DYLD_CACHE" ]; then
            # AMFI 框架
            echo "  提取 AMFI 框架..."
            ipsw dyld extract "$DYLD_CACHE" --extract "AppleMobileFileIntegrity.framework/AppleMobileFileIntegrity" --output output/frameworks/ 2>/dev/null
            ipsw dyld extract "$DYLD_CACHE" --extract "/System/Library/PrivateFrameworks/AppleMobileFileIntegrity.framework/AppleMobileFileIntegrity" --output output/frameworks/ 2>/dev/null
            
            # Security 框架
            echo "  提取 Security 框架..."
            ipsw dyld extract "$DYLD_CACHE" --extract "Security.framework/Security" --output output/frameworks/ 2>/dev/null
            ipsw dyld extract "$DYLD_CACHE" --extract "/System/Library/Frameworks/Security.framework/Security" --output output/frameworks/ 2>/dev/null
            
            echo "✅ 框架提取完成"
          fi
        continue-on-error: true
      
      # Step 7: 收集信息并生成报告
      - name: Generate extraction report
        run: |
          echo "# iOS 固件提取报告" > output/REPORT.md
          echo "" >> output/REPORT.md
          echo "## 提取信息" >> output/REPORT.md
          echo "- **设备**: ${{ inputs.device }}" >> output/REPORT.md
          echo "- **iOS 版本**: ${{ inputs.version }}" >> output/REPORT.md
          echo "- **提取时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> output/REPORT.md
          echo "- **组件选项**: ${{ inputs.components }}" >> output/REPORT.md
          echo "" >> output/REPORT.md
          
          echo "## 提取的文件" >> output/REPORT.md
          echo "" >> output/REPORT.md
          echo "### 守护进程" >> output/REPORT.md
          for f in output/daemons/*; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "- $(basename $f) ($size)" >> output/REPORT.md
            fi
          done
          
          echo "" >> output/REPORT.md
          echo "### 框架" >> output/REPORT.md
          for f in output/frameworks/*; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "- $(basename $f) ($size)" >> output/REPORT.md
            fi
          done
          
          echo "" >> output/REPORT.md
          echo "### dyld 缓存" >> output/REPORT.md
          for f in output/dyld_cache/*; do
            if [ -f "$f" ]; then
              size=$(du -h "$f" | cut -f1)
              echo "- $(basename $f) ($size)" >> output/REPORT.md
            fi
          done
          
          echo "" >> output/REPORT.md
          echo "## 文件清单" >> output/REPORT.md
          echo '```' >> output/REPORT.md
          find output -type f -not -name "REPORT.md" | sort >> output/REPORT.md
          echo '```' >> output/REPORT.md
      
      # Step 8: 打包所有提取的文件
      - name: Package extracted files
        run: |
          echo "打包提取的文件..."
          cd output
          tar -czf ../ios_extracted_${{ inputs.device }}_${{ inputs.version }}.tar.gz .
          cd ..
          echo "✅ 打包完成: ios_extracted_${{ inputs.device }}_${{ inputs.version }}.tar.gz"
          echo "package_size=$(du -h ios_extracted_*.tar.gz | cut -f1)" >> $GITHUB_OUTPUT
      
      # Step 9: 上传为 GitHub Artifact（自动下载）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_extracted_${{ inputs.device }}_${{ inputs.version }}
          path: |
            ios_extracted_*.tar.gz
            output/REPORT.md
          retention-days: 7
          compression-level: 6
      
      # Step 10: 完成通知
      - name: Completion message
        run: |
          echo "========================================="
          echo "✅ 提取完成！"
          echo "========================================="
          echo ""
          echo "📦 下载链接将在 Actions 页面显示"
          echo "   点击 'Artifacts' 下载 ios_extracted_*.tar.gz"
          echo ""
          echo "📊 提取统计:"
          echo "   守护进程: $(ls -1 output/daemons/ 2>/dev/null | wc -l) 个"
          echo "   框架: $(ls -1 output/frameworks/ 2>/dev/null | wc -l) 个"
          echo "   总大小: ~$(du -sh output/ | cut -f1)"
