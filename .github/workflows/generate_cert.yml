name: Generate Certificates

on:
  push:
    paths:
      - 'make_cert.py'
  workflow_dispatch:

jobs:
  generate:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cryptography 3.4.8 (supports SHA1)
        run: |
          pip uninstall cryptography -y || true
          pip install cryptography==3.4.8

      - name: Run certificate generator
        run: |
          python3 make_cert.py ./cert_output

      - name: Upload certificates
        uses: actions/upload-artifact@v4
        with:
          name: certificates
          path: ./cert_output/
